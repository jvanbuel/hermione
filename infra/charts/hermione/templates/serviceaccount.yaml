{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hermione.serviceAccountName" . }}
  labels:
    {{- include "hermione.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# hermione-server never calls the Kubernetes API, so it has no use for a token.
automountServiceAccountToken: false
{{- end }}
