[package]
name = "hermione-shell"
version = "0.1.0"
edition = "2021"
description = "Shell wrapper for Hermione observability platform"

[[bin]]
name = "hermione-shell"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full", "process"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.29", features = ["term", "signal", "fs", "process"] }
libc = "0.2"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
