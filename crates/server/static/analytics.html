<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermione — Analytics</title>
  <!-- Apply the saved theme before first paint so the page never flashes the
       wrong colours. No saved choice → falls through to prefers-color-scheme. -->
  <script>
    try {
      var t = localStorage.getItem('hermione.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/hermione-mark.svg" />
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/assets/chrome.css" />
  <style>
    body {
      display: flex; flex-direction: column;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base); line-height: 1.4;
      font-variant-numeric: tabular-nums;
      background: var(--bg); color: var(--fg);
    }



    /* ---- Main content ---- */
    main { flex: 1 1 auto; overflow-y: auto; padding: 24px 28px; }
    .wrap { max-width: 860px; margin: 0 auto; }

    .empty { color: var(--fg-muted); padding: 60px 24px; text-align: center; }

    .summary-card {
      display: flex; align-items: center; gap: 14px; padding: 18px 20px;
      background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); margin-bottom: 22px; box-shadow: var(--shadow-1);
    }
    .avatar {
      flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; font-size: var(--fs-base); font-weight: 700;
      color: #fff; user-select: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    }
    .summary-card .who .name { font-weight: 600; font-size: var(--fs-lg); }
    .summary-card .who .sub { color: var(--fg-muted); font-size: var(--fs-sm); }
    .summary-card .total { margin-left: auto; text-align: right; }
    .summary-card .total .num { font-size: var(--fs-xl); font-weight: 700; color: var(--accent-text); }
    .summary-card .total .lbl { color: var(--fg-subtle); font-size: var(--fs-xs);
      text-transform: uppercase; letter-spacing: .04em; }

    /* Each breakdown is a bordered panel — a tinted title bar over ruled rows —
     * so it has edges to read against, the same as the board's tree view. */
    section {
      margin-bottom: 22px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-1);
    }
    section > h2 {
      font-size: var(--fs-sm); font-weight: 600; color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: .04em; margin: 0;
      padding: 9px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    }

    /* Horizontal bar rows — used for both exercise and file breakdowns. */
    .bars { display: flex; flex-direction: column; }
    .bar-row {
      display: grid; grid-template-columns: minmax(0, 240px) 1fr auto;
      align-items: center; gap: 12px; padding: 9px 16px;
      border-top: 1px solid var(--border-subtle); transition: background .12s var(--ease);
    }
    .bar-row:first-child { border-top: 0; }
    .bar-row:hover { background: var(--surface-2); }
    .bar-row .label {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: var(--fs-sm);
    }
    .bar-row .label .ex { color: var(--fg-subtle); font-size: var(--fs-xs); }
    .bar-row .label .path { font-family: ui-monospace, monospace; }
    /* Bars share a flat left baseline (aligned starts = easy magnitude
     * comparison) and round only the data-end, per data-viz mark specs. The
     * track is a recessive "100%" rail behind each fill. */
    .bar-track { height: 9px; background: var(--border-subtle);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0; overflow: hidden; }
    /* Magnitude is one measure → one hue; a faint light→saturated gradient adds
     * depth without inventing a second colour. */
    .bar-fill {
      height: 100%; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--accent) 82%, var(--surface)), var(--accent));
    }
    .bar-row .secs { font-size: var(--fs-sm); color: var(--fg-muted); white-space: nowrap;
      font-variant-numeric: tabular-nums; font-weight: 600; }

    .note { color: var(--fg-subtle); font-size: var(--fs-sm); margin-top: 18px; }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to the board">
      <img class="logo-mark" src="/assets/hermione-mark.svg" alt="" aria-hidden="true" />
      <h1>Hermione</h1>
    </a>
    <span class="crumb">/ Analytics</span>
    <label class="visually-hidden" for="course">Course</label>
    <select id="course" title="Course"></select>
    <label class="visually-hidden" for="student">Student</label>
    <select id="student" title="Student"><option value="">Select a student…</option></select>
    <span class="spacer"></span>
    <a class="nav" href="/" title="Back to the live board">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.7 3.3 5 8l4.7 4.7 1-1L7 8l3.7-3.7z"/></svg>
      Board
    </a>
    <div id="more-wrap">
      <button id="more" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" aria-label="More" title="More — theme, sign out">
        <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>
      </button>
      <div id="more-menu" role="menu" aria-label="More" hidden>
        <button id="theme-toggle" type="button" role="menuitem"></button>
        <hr role="separator">
        <button id="logout" type="button" role="menuitem">
          <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6.5"/></svg>
          Sign out
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div id="report"><div class="empty">Pick a course and student to see their time-on-task.</div></div>
    </div>
  </main>

  <script src="/assets/common.js"></script>
  <script>

    // ---- bar rows ----
    function barRow(labelHtml, seconds, max) {
      const pct = max > 0 ? Math.max(2, Math.round((seconds / max) * 100)) : 0;
      return `<div class="bar-row">
        <div class="label">${labelHtml}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="secs">${fmtDuration(seconds)}</div>
      </div>`;
    }

    function renderReport(rep) {
      const el = document.getElementById('report');
      if (!rep || rep.totalSeconds === 0) {
        el.innerHTML = `<div class="empty">No file activity recorded for <b class="sn">${esc(rep ? rep.student : '')}</b> yet.<br>
          Time-on-task is collected by the VSCode extension.</div>`;
        return;
      }
      const hue = hashHue(rep.student);
      const exMax = Math.max(...rep.perExercise.map(e => e.seconds), 1);
      const fileMax = Math.max(...rep.perFile.map(f => f.seconds), 1);

      const exBars = rep.perExercise.length
        ? `<div class="bars">${rep.perExercise
            .map(e => barRow(`<span class="path">${esc(e.exercise)}</span>`, e.seconds, exMax))
            .join('')}</div>`
        : '<div class="empty">No exercise-tagged activity.</div>';

      const fileBars = `<div class="bars">${rep.perFile
        .map(f => {
          const name = f.relativePath || f.path;
          const ex = f.exercise ? ` <span class="ex">· ${esc(f.exercise)}</span>` : '';
          return barRow(`<span class="path" title="${esc(f.path)}">${esc(name)}</span>${ex}`, f.seconds, fileMax);
        })
        .join('')}</div>`;

      el.innerHTML = `
        <div class="summary-card">
          <div class="avatar" aria-hidden="true" style="background:hsl(${hue},26%,38%)">${esc(initials(rep.student))}</div>
          <div class="who">
            <div class="name sn">${esc(rep.student)}</div>
            <div class="sub">${rep.perFile.length} file${rep.perFile.length === 1 ? '' : 's'} · ${rep.perExercise.length} exercise${rep.perExercise.length === 1 ? '' : 's'}</div>
          </div>
          <div class="total">
            <div class="num">${fmtDuration(rep.totalSeconds)}</div>
            <div class="lbl">Total time-on-task</div>
          </div>
        </div>
        <section>
          <h2>Time per exercise</h2>
          ${exBars}
        </section>
        <section>
          <h2>Time per file</h2>
          ${fileBars}
        </section>
        <p class="note">Time-on-task counts gaps between file events, capped per gap so idle stretches aren't over-counted. Closed files and away-time are excluded.</p>`;
    }

    // ---- data loading ----
    let currentCourse = null;

    async function loadCourses() {
      let courses;
      try {
        const res = await fetch('/api/courses');
        if (res.status === 401) { window.location.href = '/login'; return; }
        courses = await res.json();
      } catch (_) { return; }
      const sel = document.getElementById('course');
      sel.innerHTML = courses.map(c => `<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join('');
      currentCourse = courses[0]?.slug || null;
      sel.addEventListener('change', () => {
        currentCourse = sel.value;
        loadStudents();
        showEmpty();
      });
      await loadStudents();
    }

    // The student list is the union of everyone who has run a terminal session
    // (recorder) and everyone seen in recent file activity (extension) — either
    // source may know a student the other doesn't.
    async function loadStudents() {
      const sel = document.getElementById('student');
      if (!currentCourse) { sel.innerHTML = '<option value="">Select a student…</option>'; return; }
      const cq = encodeURIComponent(currentCourse);
      const names = new Set();
      try {
        const [sessions, activity] = await Promise.all([
          fetch(`/api/sessions?course=${cq}`).then(r => r.ok ? r.json() : []),
          fetch(`/api/students/activity?course=${cq}`).then(r => r.ok ? r.json() : []),
        ]);
        for (const s of sessions) if (s.student) names.add(s.student);
        for (const a of activity) if (a.student) names.add(a.student);
      } catch (_) {}
      const sorted = [...names].sort((a, b) => a.localeCompare(b));
      sel.innerHTML = '<option value="">Select a student…</option>'
        + sorted.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    }

    function showEmpty() {
      document.getElementById('report').innerHTML =
        '<div class="empty">Pick a course and student to see their time-on-task.</div>';
    }

    async function loadReport(student) {
      if (!currentCourse || !student) { showEmpty(); return; }
      document.getElementById('report').innerHTML = '<div class="empty">Loading…</div>';
      try {
        const res = await fetch(`/api/analytics/time-per-file?course=${encodeURIComponent(currentCourse)}&student=${encodeURIComponent(student)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) throw new Error('http ' + res.status);
        renderReport(await res.json());
      } catch (_) {
        document.getElementById('report').innerHTML = '<div class="empty">Failed to load analytics.</div>';
      }
    }

    document.getElementById('student').addEventListener('change', (e) => loadReport(e.target.value));
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    loadCourses();
  </script>
</body>
</html>
