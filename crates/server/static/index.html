    </div>
  </header>
  <div id="content">
    <div id="board"><div class="empty">Loading…</div></div>
    <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize terminal panel"></div>
    <div id="dock"></div>
  </div>
  <footer id="statusbar">
    <span id="freshness" class="freshness">Connecting…</span>
    <span class="spacer"></span>
    <span id="hint" class="hint">Click a student to open their terminal</span>
  </footer>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="/assets/common.js"></script>
  <script>
    // xterm palettes per theme — kept in step with --bg / --fg in tokens.css so
    // the embedded terminals match the page chrome (dark = chalkboard slate).
    const TERM_THEMES = {
      dark:  { background: '#243831', foreground: '#eef1e6', cursor: '#eef1e6' },
      light: { background: '#ffffff', foreground: '#1f2328', cursor: '#1f2328' },
    };
    const openPanes = new Map(); // student -> { term, fit, es, el }
    // Fallback struggle thresholds (seconds), used only when the server sends none.
    // Normally each exercise carries its own, derived from how the class is doing
    // on it, so the sparkline marks the same lines the server flags students by.
    const WATCH_SECS = 10 * 60, HELP_SECS = 25 * 60;
    const HINT_KEY = 'hermione.hintSeen';

    const ICONS = {
      book: '<svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 1H13v11H4.5a1.5 1.5 0 0 0-1.5 1.5V2.5A1.5 1.5 0 0 1 4.5 1zM3 13.5A1.5 1.5 0 0 1 4.5 12H13v3H4.5A1.5 1.5 0 0 1 3 13.5z"/></svg>',
      clock: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      warn: '<svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.6 15 14H1L8 1.6zM7.3 6h1.4v3.6H7.3V6zm0 4.6h1.4V12.2H7.3v-1.6z"/></svg>',
      pencil: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M11.2 2.3 13.7 4.8 5.6 12.9 2.4 13.6l.7-3.2 8.1-8.1z"/></svg>',
      close: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
      chevron: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>',
      folder: '<svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.5 3.6c0-.6.4-1 1-1h3.1c.3 0 .6.1.8.4l.9 1.1h6.2c.6 0 1 .4 1 1v7.3c0 .6-.4 1-1 1H2.5c-.6 0-1-.4-1-1V3.6z"/></svg>',
      file: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 1.9h4.9l3 3v9.2H4.2z"/><path d="M9.1 1.9v3h3"/></svg>',
    };

    // ---- which view of the class is on screen ----
    const VIEW_KEY = 'hermione.view';
    let currentView = 'board';
    function setView(view) {
      currentView = (view === 'tree') ? 'tree' : 'board';
      try { localStorage.setItem(VIEW_KEY, currentView); } catch (_) {}
      for (const b of document.querySelectorAll('#view-toggle button')) {
        b.setAttribute('aria-pressed', String(b.dataset.view === currentView));
      }
      // The two views share #board but lay it out completely differently, so a
      // switch has to start from an empty container rather than reconcile
      // columns into rows.
      document.getElementById('board').replaceChildren();
      if (lastOverview) renderView(lastOverview);
    }

    // ---- the course being watched, remembered across reloads ----
    // A teacher watching one class all morning should not be dropped back onto
    // whichever course happens to sort first every time the page reloads.
    const COURSE_KEY = 'hermione.course';
    function rememberCourse(slug) {
      currentCourse = slug;
      try {
        if (slug) localStorage.setItem(COURSE_KEY, slug);
        else localStorage.removeItem(COURSE_KEY);
      } catch (_) { /* private mode — the switcher still works, it just forgets */ }
    }
    function rememberedCourse() {
      try { return localStorage.getItem(COURSE_KEY); } catch (_) { return null; }
    }

    // ---- theme: the switch itself is in common.js; the terminals follow it ----
    function termTheme() { return TERM_THEMES[effectiveTheme()]; }
    document.addEventListener('hermione:theme', () => {
      openPanes.forEach(p => { if (p.term) p.term.options.theme = termTheme(); });
    });

    function avatarHtml(name, status, extraClass = '') {
      const hue = hashHue(name);
      // Muted fill so per-student colour aids recognition without competing with
      // the semantic red/amber struggle language.
      return `<div class="avatar ${extraClass}" aria-hidden="true" style="background:hsl(${hue},26%,38%)">
        ${esc(initials(name))}<span class="dot ${status}" title="${status}"></span></div>`;
    }
    function timeAgo(ms) {
      const s = Math.round((Date.now() - ms) / 1000);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.round(s / 60)}m ago`;
      return `${Math.round(s / 3600)}h ago`;
    }
    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    // Keyed, in-place reconciliation of a container's children, so the 3s
    // refresh never wipes the DOM — scroll position, focus, and hover survive.
    function reconcile(parent, items, keyOf, create, update) {
      const byKey = new Map();
      for (const n of Array.from(parent.children)) {
        if (n.dataset && n.dataset.key != null) byKey.set(n.dataset.key, n);
        else n.remove(); // drop non-keyed placeholders (e.g. the empty state)
      }
      const desired = items.map(item => {
        const key = String(keyOf(item));
        let n = byKey.get(key);
        if (n) byKey.delete(key);
        else { n = create(item); n.dataset.key = key; }
        update(n, item);
        return n;
      });
      for (const n of byKey.values()) n.remove();
      desired.forEach((n, i) => {
        if (parent.children[i] !== n) parent.insertBefore(n, parent.children[i] || null);
      });
    }

    // ---- board rendering ----
    function cardInner(s) {
      const pill = s.struggle === 'help' ? '<span class="pill help">needs help</span>'
                 : s.struggle === 'watch' ? '<span class="pill watch">watch</span>' : '';
      const reason = (s.struggleReasons && s.struggleReasons.length)
        ? `<div class="reason">${ICONS.warn}<span>${esc(s.struggleReasons.join(' · '))}</span></div>` : '';
      // Recent typing is the counterweight to the clock: a long time on an
      // exercise reads very differently when the student is still writing code.
      // The edit window is longer than the active window, so gate on status too
      // — someone who left four minutes ago is not "typing".
      const typing = s.status === 'active' && s.editsRecent > 0
        ? `<span class="sep">·</span><span class="typing" title="${s.editsRecent} edits in the last few minutes">${ICONS.pencil}typing</span>` : '';
      const prov = (s.studentSource || s.repo)
        ? `<div class="prov" title="identity provenance">${esc(s.studentSource || '?')}${s.repo ? ` · ${esc(s.repo)}` : ''}</div>` : '';
      return `
        ${avatarHtml(s.student, s.status)}
        <div class="who">
          <div class="name"><span class="nm">${esc(s.student)}</span>${pill}</div>
          <div class="file">${esc(s.file || '—')}</div>
          ${prov}
          ${reason}
          <div class="time">
            <span class="clock">${ICONS.clock}${fmtDuration(s.secondsOnExercise)}</span>
            <span class="sep">·</span><span>${timeAgo(s.lastSeenUnixMs)}</span>
            ${typing}
          </div>
        </div>`;
    }
    function createCard() {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      // Bound once, not per refresh; reads its live data-* on click.
      b.addEventListener('click', () =>
        openTerminal(b.dataset.student, b.dataset.session || null, b.dataset.exercise || null));
      return b;
    }
    function updateCard(b, s) {
      b.dataset.student = s.student;
      b.dataset.session = s.terminalSessionId || '';
      b.dataset.exercise = s.exercise || '';
      b.classList.toggle('open', openPanes.has(s.student));
      b.classList.toggle('struggle-help', s.struggle === 'help');
      b.classList.toggle('struggle-watch', s.struggle === 'watch');
      const label = `${s.student}, ${s.exercise || 'no exercise'}, ${s.status}`
        + (s.struggle === 'help' ? ', needs help' : s.struggle === 'watch' ? ', watch' : '');
      b.setAttribute('aria-label', label);
      b.innerHTML = cardInner(s);
    }

    // A compact distribution strip of time-on-exercise across the group, with
    // the watch/help thresholds marked — so "everyone's piled up at 25 min"
    // reads as a shape, not a number you compute by scanning cards.
    function sparkline(students, st) {
      if (!students.length) return '';
      const watchAt = (st && st.watchSecs) || WATCH_SECS, helpAt = (st && st.helpSecs) || HELP_SECS;
      const W = 232, H = 22, padX = 4;
      const max = Math.max(helpAt, ...students.map(s => s.secondsOnExercise || 0));
      const x = secs => padX + (W - 2 * padX) * Math.min(secs, max) / max;
      // Severity is ordinal (ok < watch < help), so encode it TWICE: by hue and
      // by mark size. Red↔amber are indistinguishable under deuteranopia, so the
      // size ramp is what carries the distinction when colour can't — and it
      // reads in greyscale/print too. A surface-coloured ring separates dots
      // that pile up at the same time.
      const sev = s => s.struggle === 'help' ? 2 : s.struggle === 'watch' ? 1 : 0;
      const R = [2.8, 3.6, 4.4], COLOR = ['var(--green)', 'var(--amber)', 'var(--red)'];
      const thr = [watchAt, helpAt]
        .map(t => `<line class="thr" x1="${x(t).toFixed(1)}" y1="1" x2="${x(t).toFixed(1)}" y2="${H - 1}"/>`)
        .join('');
      // Draw calm dots first so the ones that need attention sit on top.
      const dots = students.slice().sort((a, b) => sev(a) - sev(b))
        .map(s => { const k = sev(s);
          return `<circle cx="${x(s.secondsOnExercise || 0).toFixed(1)}" cy="${H / 2}" r="${R[k]}" fill="${COLOR[k]}" fill-opacity="0.9" stroke="var(--surface)" stroke-width="1"/>`; })
        .join('');
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Time-on-exercise distribution across the group; larger dots are students who need attention"><title>${st && st.cohortSize ? `Lines mark outliers of this exercise's class: watch past ${fmtDuration(watchAt)}, help past ${fmtDuration(helpAt)}` : `Lines mark ${fmtDuration(watchAt)} and ${fmtDuration(helpAt)} — too few students to compare against the class`}</title>${thr}${dots}</svg>`;
    }

    function summaryHtml(st) {
      if (!st || st.total === 0) return '<span class="muted">no activity yet</span>';
      const help = st.needHelp ? ` · <span class="warn">${st.needHelp} need help</span>` : '';
      return `${st.active} active${help} · med ${fmtDuration(st.medianSeconds)}`;
    }

    function createColumn() {
      const col = document.createElement('div');
      col.className = 'column';
      col.innerHTML = `<h2><span class="col-title"></span><span class="count"></span></h2>
        <div class="summary"></div>
        <div class="cards"></div>`;
      return col;
    }
    function updateColumn(col, c) {
      const g = c.g;
      const isEx = c.kind === 'ex';
      col.classList.toggle('unassigned', !isEx);
      const title = g.title || g.exercise || 'No exercise';
      col.querySelector('.col-title').innerHTML = (isEx ? ICONS.book : '') + `<span>${esc(title)}</span>`;
      const st = isEx ? (g.stats || { total: g.students.length, active: 0, needHelp: 0, medianSeconds: 0 }) : null;
      col.querySelector('.count').textContent = isEx ? st.total : g.students.length;
      const summary = col.querySelector('.summary');
      if (isEx) {
        summary.style.display = '';
        summary.innerHTML = summaryHtml(st) + sparkline(g.students, st);
      } else {
        summary.style.display = 'none';
        summary.innerHTML = '';
      }
      reconcile(col.querySelector('.cards'), g.students, s => s.student, createCard, updateCard);
    }

    let lastAudience = 0;

    function setAlert(n) {
      const a = document.getElementById('alert');
      a.innerHTML = n ? `<span class="alert-dot"></span>${n} need help` : '';
    }

    let lastOverview = null;

    function renderView(data) {
      lastOverview = data;
      const board = document.getElementById('board');
      const allStudents = data.exercises.flatMap(g => g.students).concat(data.noExercise);
      lastAudience = allStudents.length;
      setAlert(allStudents.filter(s => s.struggle === 'help').length);
      board.classList.toggle('tree', currentView === 'tree');

      if (data.exercises.length === 0 && data.noExercise.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = 'No exercises defined and no activity yet.<br>Define exercises and start the recorder + VSCode extension.';
        board.replaceChildren(empty);
        return;
      }
      if (currentView === 'tree') renderTree(board, data);
      else renderBoard(board, data);
    }

    // ---- tree view ----
    // The repo's real folders, fetched once per course. The tree is drawn from
    // these rather than from the course's exercises: exercises are only the
    // subset someone defined, and are themselves often derived from the repo's
    // .hermione.json. Refresh runs every 3s, so this must never be part of it.
    let repoDirs = { course: null, dirs: [], loading: false };
    async function loadRepoDirs(slug) {
      if (!slug || repoDirs.course === slug || repoDirs.loading) return;
      repoDirs.loading = true;
      try {
        const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/tree`);
        const body = res.ok ? await res.json() : { dirs: [] };
        repoDirs = { course: slug, dirs: body.dirs || [], loading: false };
      } catch (_) {
        // A failed fetch must not blank the tree — fall back to open paths.
        repoDirs = { course: slug, dirs: [], loading: false };
      }
      if (currentView === 'tree' && lastOverview) renderView(lastOverview);
    }

    // Only the paths someone actually has open, so the tree is the class's
    // attention rather than a directory listing. Same shape as `tree`: one
    // entry per line, directories before files, connectors on the left.
    function buildTree(students, dirs = []) {
      const root = { dirs: new Map(), files: new Map() };
      const descend = (parts) => {
        let node = root;
        for (const dir of parts) {
          if (!node.dirs.has(dir)) node.dirs.set(dir, { dirs: new Map(), files: new Map() });
          node = node.dirs.get(dir);
        }
        return node;
      };
      // Real folders first, so the structure is the repo's and stays put as
      // students move around inside it.
      for (const d of dirs) descend(String(d).split('/').filter(Boolean));
      for (const s of students) {
        const path = String(s.file || '').replace(/^\/+/, '');
        if (!path) continue; // nothing open — nothing to place in the tree
        const parts = path.split('/').filter(p => p && p !== '.');
        if (!parts.length) continue;
        const file = parts.pop();
        const node = descend(parts);
        if (!node.files.has(file)) node.files.set(file, []);
        node.files.get(file).push(s);
      }
      return root;
    }

    // ---- which folders are collapsed, remembered per course ----
    // A folder with people in it is open by default: showing them is the point.
    const treeClosed = new Set();
    let treeClosedFor = null;
    const treeClosedKey = () => `hermione.treeClosed:${currentCourse}`;
    function loadTreeClosed() {
      if (treeClosedFor === currentCourse) return;
      treeClosedFor = currentCourse;
      treeClosed.clear();
      try { for (const k of JSON.parse(localStorage.getItem(treeClosedKey()) || '[]')) treeClosed.add(k); } catch (_) {}
    }
    function toggleFolder(key) {
      loadTreeClosed();
      if (!treeClosed.delete(key)) treeClosed.add(key);
      try { localStorage.setItem(treeClosedKey(), JSON.stringify([...treeClosed])); } catch (_) {}
      if (lastOverview) renderView(lastOverview);
    }

    const SEVERITY = { help: 2, watch: 1 };

    /** How many students are in a folder, at any depth, and how many of them need attention. */
    function census(node) {
      const c = { count: 0, help: 0, watch: 0 };
      const add = (n) => { c.count += n.count; c.help += n.help; c.watch += n.watch; };
      for (const students of node.files.values()) {
        add({ count: students.length,
              help: students.filter(s => s.struggle === 'help').length,
              watch: students.filter(s => s.struggle === 'watch').length });
      }
      for (const d of node.dirs.values()) add(census(d));
      return c;
    }
    const worstOf = (c) => c.help ? 'help' : c.watch ? 'watch' : null;

    function treeRows(root) {
      loadTreeClosed();
      const rows = [];
      const byName = (a, b) => a[0].localeCompare(b[0]);
      // Who needs help first: it is the reason to look at this view at all.
      const bySeverity = (a, b) => (SEVERITY[b.struggle] || 0) - (SEVERITY[a.struggle] || 0)
        || a.student.localeCompare(b.student);
      // Folders before files at every level, as `tree` does.
      (function walk(node, prefix, depth) {
        for (const [name, v] of [...node.dirs.entries()].sort(byName)) {
          const key = prefix + '/' + name;
          const kids = v.dirs.size + v.files.size;
          const open = kids > 0 && !treeClosed.has(key);
          rows.push({ key, name, dir: true, depth, kids, open, ...census(v), people: [] });
          if (open) walk(v, key, depth + 1);
        }
        for (const [name, students] of [...node.files.entries()].sort(byName)) {
          rows.push({ key: prefix + '/' + name, name, dir: false, depth, people: students.slice().sort(bySeverity) });
        }
      })(root, '', 0);
      return rows;
    }

    function createTreeRow() {
      const el = document.createElement('div');
      el.innerHTML = `<div class="tpath"><span class="tchev">${ICONS.chevron}</span><span class="ticon"></span>`
        + '<span class="tname"></span><span class="tcount"></span></div>'
        + '<div class="tpeople"></div><div class="tsum"></div>';
      return el;
    }

    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

    function updateTreeRow(el, row) {
      // Only a folder that has something in it can be opened or closed.
      const toggle = row.dir && !row.root && row.kids > 0;
      el.className = 'trow ' + (row.dir ? 'dir' : 'file') + (row.root ? ' root' : '') + (row.open ? ' open' : '')
        + (row.dir && !row.root && row.count === 0 ? ' quiet' : '');
      el.style.setProperty('--depth', row.depth);

      const path = el.querySelector('.tpath');
      path.classList.toggle('toggle', toggle);
      if (toggle) {
        path.setAttribute('role', 'button');
        path.tabIndex = 0;
        path.setAttribute('aria-expanded', String(row.open));
        path.title = row.open ? 'Collapse' : 'Expand';
        path.onclick = () => toggleFolder(row.key);
        path.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFolder(row.key); } };
      } else {
        for (const a of ['role', 'tabindex', 'aria-expanded', 'title']) path.removeAttribute(a);
        path.onclick = path.onkeydown = null;
      }
      el.querySelector('.tchev').style.visibility = toggle ? '' : 'hidden';
      el.querySelector('.ticon').innerHTML = row.dir ? ICONS.folder : ICONS.file;
      el.querySelector('.tname').textContent = row.name;

      // A folder says how many are inside it and, if anyone needs it, how badly.
      const count = el.querySelector('.tcount');
      const showCount = row.dir && !row.root && row.count > 0;
      count.hidden = !showCount;
      if (showCount) {
        const worst = worstOf(row);
        count.textContent = row.count;
        count.className = 'tcount' + (worst ? ' ' + worst : '');
        count.title = plural(row.count, 'student')
          + (row.help ? `, ${row.help} need${row.help === 1 ? 's' : ''} help` : '')
          + (row.watch ? `, ${row.watch} to watch` : '');
      }

      // The repo row carries the whole class's summary where a file row carries people.
      el.querySelector('.tsum').textContent = row.root
        ? (row.count ? plural(row.count, 'student') + ' in a file'
            + (row.help ? ` · ${row.help} need${row.help === 1 ? 's' : ''} help` : '')
            + (row.watch ? ` · ${row.watch} to watch` : '') : 'nobody has a file open')
        : '';

      reconcile(el.querySelector('.tpeople'), row.people, s => s.student, () => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tperson';
        return b;
      }, (b, s) => {
        b.className = 'tperson' + (s.struggle === 'help' ? ' help' : s.struggle === 'watch' ? ' watch' : '');
        b.title = `${s.student} — open their file`;
        b.innerHTML = `${avatarHtml(s.student, s.status)}<span class="pname">${esc(s.student)}</span>`
          + (s.struggle === 'help' ? '<span class="pill help">needs help</span>'
            : s.struggle === 'watch' ? '<span class="pill watch">watch</span>' : '');
        // Clicking someone in the file tree means "show me that file", not
        // "show me their shell".
        b.onclick = () => openTerminal(s.student, s.terminalSessionId, s.exercise, 'file');
      });
    }

    function renderTree(board, data) {
      const students = data.exercises.flatMap(g => g.students).concat(data.noExercise);
      // Top-level repo folders only. Deeper ones arrive from the paths students
      // actually have open, so a repo's theme and build internals — seven of
      // the seventeen directories in one real course — don't bury the
      // exercises on a board being scanned mid-class.
      const dirs = (repoDirs.course === currentCourse ? repoDirs.dirs : [])
        .filter(d => !String(d).includes('/'));
      const root = buildTree(students, dirs);
      const rows = treeRows(root);
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = repoDirs.course === currentCourse
          ? 'Nobody has a file open, and the linked repository has no folders to show.'
          : 'Link a repository to this course to see its structure.';
        board.replaceChildren(empty);
        return;
      }

      // Every row's name cell is as wide as the widest needs, so the people line
      // up in one column down the page. `ch` is a monospace character, and the
      // rest is the room for chevron, icon, count and gaps.
      let maxLen = 0, maxDepth = 0;
      for (const r of rows) { maxLen = Math.max(maxLen, r.name.length); maxDepth = Math.max(maxDepth, r.depth); }
      board.style.setProperty('--name-w', `min(45%, calc(${maxDepth} * 22px + ${maxLen}ch + 100px))`);

      const c = courseList.find(c => c.slug === currentCourse);
      rows.unshift({ key: '__root__', name: (c && c.repoUrl) ? repoLabel(c.repoUrl) : '.', dir: true, root: true,
        depth: 0, kids: 0, open: false, ...census(root), people: [] });
      reconcile(board, rows, r => r.key, createTreeRow, updateTreeRow);
    }

    function renderBoard(board, data) {
      const cols = data.exercises.map(g => ({ key: 'ex:' + g.exercise, kind: 'ex', g }));
      if (data.noExercise.length) {
        cols.push({ key: '__none__', kind: 'none', g: { title: 'No exercise', students: data.noExercise } });
      }
      reconcile(board, cols, c => c.key, createColumn, updateColumn);
    }

    let currentCourse = null;
    let courseList = []; // last-fetched active courses (slug, name, repoUrl, archived)

    async function fetchCourses() {
      const res = await fetch('/api/courses');
      if (res.status === 401) { window.location.href = '/login'; return null; }
      return res.json();
    }

    // A repo URL shown as a compact "owner/name" chip; falls back to the host path.
    function repoLabel(url) {
      try {
        const u = new URL(url);
        return u.pathname.replace(/^\/+|\/+$|\.git$/g, '') || u.host;
      } catch (_) {
        const m = url.match(/[:/]([^/:]+\/[^/]+?)(?:\.git)?\/?$/);
        return m ? m[1] : url;
      }
    }

    // Only http(s) URLs are safe as an href — a stored `javascript:`/`data:`
    // repoUrl must never become a clickable link in another teacher's session.
    function safeHttpUrl(url) {
      try {
        const u = new URL(url);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
      } catch (_) { return null; }
    }

    function updateCourseRepo() {
      const c = courseList.find(c => c.slug === currentCourse);
      const link = document.getElementById('course-repo');
      // Toggle style.display, not [hidden]: the .course-repo rule sets
      // display:inline-flex, which would override the hidden attribute.
      if (!c || !c.repoUrl) { link.style.display = 'none'; return; }
      document.getElementById('course-repo-name').textContent = repoLabel(c.repoUrl);
      const href = safeHttpUrl(c.repoUrl);
      if (href) {
        link.href = href;
        link.classList.remove('unlinked');
      } else {
        // Non-http(s) (e.g. an ssh git URL) — show the label, but not clickable.
        link.removeAttribute('href');
        link.classList.add('unlinked');
      }
      link.style.display = '';
    }

    function populateCourses(courses, selectSlug) {
      courseList = courses;
      const sel = document.getElementById('course');
      sel.innerHTML = courses.map(c => `<option value="${esc(c.slug)}"${c.description ? ` title="${esc(c.description)}"` : ''}>${esc(c.name)}</option>`).join('');
      const preferred = selectSlug || rememberedCourse();
      const want = (preferred && courses.some(c => c.slug === preferred))
        ? preferred : (courses[0]?.slug || null);
      if (want) sel.value = want;
      rememberCourse(want);
      document.getElementById('course-settings').disabled = !want;
      document.getElementById('course').style.display = courses.length ? '' : 'none';
      updateCourseRepo();
      if (!courses.length) showNoCourses();
    }

    // First-run: a teacher with no courses yet. Prompt them to create one rather
    // than leaving the board on a perpetual "Loading…".
    function showNoCourses() {
      const board = document.getElementById('board');
      const el = document.createElement('div');
      el.className = 'empty first-run';
      el.innerHTML = `<h2>No courses yet</h2>
        <p>Create a course — or link an existing git repo as one — to start watching students.</p>
        <button class="btn primary" id="fr-create" type="button">Create your first course</button>`;
      board.replaceChildren(el);
      board.querySelector('#fr-create').addEventListener('click', openNewCourse);
    }

    async function loadCourses() {
      let courses;
      try { courses = await fetchCourses(); } catch (_) { return; }
      if (!courses) return;
      populateCourses(courses);
      document.getElementById('course').addEventListener('change', () => {
        rememberCourse(document.getElementById('course').value);
        updateCourseRepo();
        [...openPanes.keys()].forEach(closeTerminal); // terminals belong to a course
        connectMessages();
        refresh();
      });
      connectMessages();
    }

    // After creating/archiving a course, refresh the switcher and jump to a course.
    async function reloadCourses(selectSlug) {
      let courses;
      try { courses = await fetchCourses(); } catch (_) { return; }
      if (!courses) return;
      populateCourses(courses, selectSlug);
      [...openPanes.keys()].forEach(closeTerminal);
      connectMessages();
      refresh();
    }

    // ---- live messages (WebSocket) ----
    let msgSocket = null;
    function connectMessages() {
      if (msgSocket) { try { msgSocket.close(); } catch (_) {} msgSocket = null; }
      if (!currentCourse) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws?course=${encodeURIComponent(currentCourse)}`);
      msgSocket = ws;
      ws.onmessage = (ev) => {
        try { const m = JSON.parse(ev.data); if (m && m.body) toast(m.body); } catch (_) {}
      };
      ws.onclose = () => { if (msgSocket === ws) { msgSocket = null; setTimeout(connectMessages, 5000); } };
    }
    function toast(text) {
      const c = document.getElementById('toasts');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = text;
      c.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 5000);
    }

    // ---- freshness ----
    let lastUpdated = 0, lastError = false;
    function setFreshness() {
      const el = document.getElementById('freshness');
      if (lastError) {
        el.className = 'freshness failed';
        el.innerHTML = '<span class="fdot"></span>Update failed — retrying';
        return;
      }
      if (!lastUpdated) { el.className = 'freshness'; el.textContent = 'Connecting…'; return; }
      const s = Math.round((Date.now() - lastUpdated) / 1000);
      el.className = 'freshness' + (s > 15 ? ' stale' : '');
      el.innerHTML = `<span class="fdot"></span>Updated ${s}s ago`;
    }
    setInterval(setFreshness, 1000);

    async function refresh() {
      if (!currentCourse) return;
      let data;
      try {
        const res = await fetch(`/api/overview?course=${encodeURIComponent(currentCourse)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) throw new Error('http ' + res.status);
        data = await res.json();
      } catch (_) { lastError = true; setFreshness(); return; }
      lastError = false; lastUpdated = Date.now(); setFreshness();
      renderView(data);
      loadRepoDirs(currentCourse);
    }

    // ---- student panes (their terminal, and the file they have open) ----
    function openTerminal(student, sessionId, exercise, mode) {
      if (!student) return;
      if (openPanes.has(student)) {
        if (mode) setPaneMode(student, mode);
        flashPane(student);
        return;
      }
      if (!localStorage.getItem(HINT_KEY)) {
        localStorage.setItem(HINT_KEY, '1');
        document.getElementById('hint').style.display = 'none';
      }

      const dock = document.getElementById('dock');
      const pane = document.createElement('div');
      pane.className = 'pane';
      pane.innerHTML = `
        <div class="pane-head">
          ${avatarHtml(student, 'active')}
          <span class="who"><b>${esc(student)}</b> ${exercise ? `<span class="ex">· ${esc(exercise)}</span>` : ''}</span>
          <div class="modes" role="group" aria-label="What to watch for ${esc(student)}">
            <button type="button" data-mode="term" aria-pressed="true">Terminal</button>
            <button type="button" data-mode="file" aria-pressed="false">File</button>
          </div>
          <button class="diff" type="button" aria-pressed="false" title="Show the diff against their last commit">Diff</button>
          <button class="close" type="button" title="Close" aria-label="Close ${esc(student)}'s pane">${ICONS.close}</button>
        </div>
        <div class="term"></div>
        <div class="filev">
          <div class="fv-head"></div>
          <div class="fv-body empty" role="region" tabindex="0" aria-label="${esc(student)}'s file"><div class="note" role="status">Asking ${esc(student)}'s editor…</div></div>
        </div>`;
      dock.appendChild(pane);
      dock.classList.add('active');
      document.getElementById('divider').classList.add('active');
      pane.querySelector('.close').addEventListener('click', () => closeTerminal(student));
      for (const b of pane.querySelectorAll('.modes button')) {
        b.addEventListener('click', () => setPaneMode(student, b.dataset.mode));
      }
      pane.querySelector('.diff').addEventListener('click', () => toggleDiff(student));

      const body = pane.querySelector('.term');
      let term = null, fit = null;

      if (!sessionId) {
        body.innerHTML = `<div class="note">No terminal session recorded for <b>${esc(student)}</b> yet.</div>`;
      } else {
        term = new Terminal({ fontFamily: 'ui-monospace, monospace', fontSize: 13,
          scrollback: 10000, theme: termTheme(), convertEol: false });
        fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(body);
        setTimeout(() => { try { fit.fit(); } catch (_) {} }, 0);
      }

      const rec = {
        el: pane, sessionId, term, fit,
        es: null,                 // the terminal stream, open only while the terminal is showing
        mode: 'term',             // 'term' | 'file'
        diff: false,              // in file mode: the buffer, or its diff
        last: null,               // the latest reply for the file view
        lastKey: null, lastHead: null, lastLine: null,   // what was last drawn, so a poll that changed nothing redraws nothing
        pollFailed: false,        // the file view's last poll did not arrive
      };
      openPanes.set(student, rec);
      // Opening from the tree means the teacher is already looking at files.
      if (mode === 'file') setPaneMode(student, mode); else startTerminalStream(rec);
      relayout();
      markOpenCards();
    }

    /**
     * The terminal streams only while it is on screen. Each stream holds one of
     * the browser's connections to this server open — six over HTTP/1.1 — so a
     * pane showing a file that kept its terminal stream would starve every other
     * request the page makes, the file view's own polls included.
     */
    function startTerminalStream(p) {
      if (!p.term || p.es) return;
      p.term.reset();     // the stream replays the session from its start
      p.es = new EventSource(`/api/sessions/${p.sessionId}/stream?history=true`);
      p.es.onmessage = (e) => {
        const chunk = JSON.parse(e.data);
        if (chunk.stream === 'stdout') p.term.write(b64ToBytes(chunk.data));
      };
    }
    function stopTerminalStream(p) {
      if (p.es) { p.es.close(); p.es = null; }
    }

    function closeTerminal(student) {
      const p = openPanes.get(student);
      if (!p) return;
      if (p.es) p.es.close();
      if (p.term) p.term.dispose();
      p.el.remove();
      openPanes.delete(student);
      syncSnapshotPolling();
      if (openPanes.size === 0) {
        document.getElementById('dock').classList.remove('active');
        const div = document.getElementById('divider');
        div.classList.remove('active');
        // Hand the space back to the board and clear any dragged sizing.
        document.getElementById('board').style.flex = '';
        document.getElementById('dock').style.flex = '';
      }
      relayout();
      markOpenCards();
    }

    function flashPane(student) {
      const p = openPanes.get(student);
      if (!p) return;
      p.el.style.outline = '2px solid var(--accent)';
      setTimeout(() => { p.el.style.outline = ''; }, 600);
    }

    function markOpenCards() {
      document.querySelectorAll('.card').forEach(el => {
        el.classList.toggle('open', openPanes.has(el.dataset.student));
      });
    }

    // A pane's header is the smallest thing that has to fit: avatar, the
    // Terminal/File switch, Diff and close, plus room for a name. Narrower than
    // this its controls are pushed out of sight.
    const MIN_PANE_WIDTH = 340;

    // Lay panes out in a near-square grid — but never with more columns than fit
    // at MIN_PANE_WIDTH — and refit.
    function relayout() {
      const dock = document.getElementById('dock');
      const n = openPanes.size;
      const wanted = n <= 1 ? 1 : n <= 4 ? 2 : 3;
      const fits = Math.max(1, Math.floor(dock.clientWidth / MIN_PANE_WIDTH));
      dock.style.gridTemplateColumns = `repeat(${Math.min(wanted, fits)}, 1fr)`;
      setTimeout(refitPanes, 30);
    }

    function refitPanes() { openPanes.forEach(p => { try { p.fit && p.fit.fit(); } catch (_) {} }); }
    // The column count depends on the width, so a resize re-lays out, not only refits.
    window.addEventListener('resize', relayout);

    // ---- the file a student has on screen ----
    // Snapshots are pulled, not pushed: each poll asks that student's editor
    // for what's in front of them, so nothing is sent while no pane is open.
    const SNAPSHOT_POLL_MS = 1500;
    // Past this, say so rather than pass an old buffer off as live.
    const SNAPSHOT_STALE_MS = 8000;
    let snapshotPoll = null;

    function setPaneMode(student, mode) {
      const p = openPanes.get(student);
      if (!p) return;
      p.mode = (mode === 'file') ? 'file' : 'term';
      p.el.classList.toggle('mode-file', p.mode === 'file');
      for (const b of p.el.querySelectorAll('.modes button')) {
        b.setAttribute('aria-pressed', String(b.dataset.mode === p.mode));
      }
      syncSnapshotPolling();
      if (p.mode === 'file') {
        stopTerminalStream(p);
        pollSnapshot(student, p);
      } else {
        startTerminalStream(p);
        // xterm sizes to a hidden element as 0 columns, so it needs a refit
        // once the pane is visible again.
        refitPanes();
      }
    }

    function toggleDiff(student) {
      const p = openPanes.get(student);
      if (!p) return;
      p.diff = !p.diff;
      p.el.querySelector('.diff').setAttribute('aria-pressed', String(p.diff));
      // The snapshot already carries the diff, so this is a re-render, not a
      // round trip to the student's editor.
      if (p.last) renderSnapshot(student, p, p.last);
    }

    function syncSnapshotPolling() {
      const wanted = [...openPanes.values()].some(p => p.mode === 'file');
      if (wanted && !snapshotPoll) {
        snapshotPoll = setInterval(
          () => openPanes.forEach((p, student) => p.mode === 'file' && pollSnapshot(student, p)),
          SNAPSHOT_POLL_MS);
      } else if (!wanted && snapshotPoll) {
        clearInterval(snapshotPoll);
        snapshotPoll = null;
      }
    }

    async function pollSnapshot(student, pane) {
      let data;
      try {
        const url = `/api/students/file?course=${encodeURIComponent(currentCourse)}`
          + `&student=${encodeURIComponent(student)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
      } catch (_) {
        // Keep what is on screen, but say it is no longer being updated: the age
        // the backend last reported stops advancing exactly when polls stop
        // arriving, so without this a dead connection looks like a fresh buffer.
        if (openPanes.get(student) === pane) {
          pane.pollFailed = true;
          if (pane.last) renderSnapshot(student, pane, pane.last);
        }
        return;
      }
      // The pane may have closed while the request was in flight.
      if (openPanes.get(student) !== pane) return;
      pane.pollFailed = false;
      pane.last = data;
      renderSnapshot(student, pane, data);
    }

    /**
     * What the pane should show, from what the backend reported. A closed set:
     * every reply lands in exactly one of these, so there is no combination of
     * flags to reason about.
     */
    function paneState(data) {
      const latest = data.latest;
      if (!latest) return { kind: data.connected ? 'asking' : 'offline' };
      const snapshot = latest.snapshot;
      return snapshot.state === 'file'
        ? { kind: 'file', file: snapshot, latest }
        : { kind: snapshot.state };      // 'declined' | 'empty'
    }

    const PANE_NOTES = {
      asking:   n => `Asking <b>${n}</b>'s editor…`,
      offline:  n => `<b>${n}</b>'s editor isn't connected.<br>The VSCode extension reports the file they have open.`,
      lost:     ()  => `Lost the connection to the server — retrying…`,
      declined: n => `<b>${n}</b> has file sharing turned off.`,
      empty:    n => `<b>${n}</b> has no file open.`,
    };

    function renderSnapshot(student, p, data) {
      const head = p.el.querySelector('.fv-head');
      const body = p.el.querySelector('.fv-body');
      const state = paneState(data);

      if (state.kind !== 'file') {
        head.innerHTML = '';
        body.classList.add('empty');
        const kind = p.pollFailed ? 'lost' : state.kind;
        body.innerHTML = `<div class="note" role="status">${PANE_NOTES[kind](esc(student))}</div>`;
        p.lastKey = p.lastHead = null;
        return;
      }
      const { file: s, latest } = state;

      // Redrawing an unchanged buffer would throw away the teacher's text
      // selection and restart the caret blink every poll. Snapshots are
      // replaced wholesale rather than edited, and the backend numbers each one,
      // so its `rev` identifies it exactly — no need to compare the buffer.
      const key = `${p.diff}:${latest.rev}`;
      const headHtml = snapshotHead(s, latest.ageMs, p.pollFailed);
      if (headHtml !== p.lastHead) {
        head.innerHTML = headHtml; // freshness still ticks
        p.lastHead = headHtml;
      }
      if (p.lastKey === key) return;
      p.lastKey = key;

      const html = p.diff ? diffHtml(s) : codeHtml(s);
      const prevTop = body.scrollTop;
      body.classList.toggle('empty', html === null);
      body.innerHTML = html === null
        ? `<div class="note" role="status">${diffNote(s, esc(student))}</div>`
        : `<div class="rows">${html}</div>`;
      if (html === null) return;

      // Follow the cursor when it moves; otherwise leave the teacher where they
      // scrolled to.
      const line = s.cursor?.line;
      const cursorMoved = !p.diff && line && line !== p.lastLine;
      p.lastLine = line;
      const cur = cursorMoved ? body.querySelector('.cl.cur') : null;
      body.scrollTop = cur ? Math.max(0, cur.offsetTop - body.clientHeight / 2) : prevTop;
    }

    function snapshotHead(s, ageMs, connectionLost) {
      const chip = (text, cls = '') => `<span class="chip${cls && ' ' + cls}">${text}</span>`;
      const bits = [`<span class="fp" title="${esc(s.path)}">${esc(s.relativePath)}</span>`];
      if (s.dirty) bits.push(chip('unsaved'));
      if (s.truncated) bits.push(chip('truncated'));
      if (connectionLost) {
        bits.push(chip('connection lost', 'stale'));
      } else if (ageMs > SNAPSHOT_STALE_MS) {
        bits.push(chip(timeAgo(Date.now() - ageMs), 'stale'));
      }
      bits.push(`<span class="sum">${diffSummary(s.baseline)}</span>`);
      return bits.join('');
    }

    function diffSummary(baseline) {
      switch (baseline.kind) {
        case 'untracked': return '<span class="plus">new file</span> · never committed';
        case 'none': return 'no git baseline';
        default:
          if (!baseline.added && !baseline.removed) return 'no changes since last commit';
          return `<span class="plus">+${baseline.added}</span> <span class="minus">−${baseline.removed}</span>`
            + (baseline.truncated ? ' · diff truncated' : '');
      }
    }

    /** Why the Diff view has nothing to draw. Only asked when it doesn't. */
    function diffNote(s, student) {
      const b = s.baseline;
      if (b.kind === 'untracked') return `<b>${student}</b> hasn't committed this file yet, so there is nothing to compare it with.`;
      if (b.kind === 'none') return 'No git baseline for this file (a notebook cell, or not a git repository).';
      if (b.added || b.removed) return 'The diff is too large to show.';
      return `No changes since <b>${student}</b>'s last commit.`;
    }

    /** The buffer, with the student's caret drawn where it actually is. */
    function codeHtml(s) {
      const lines = s.content.split('\n');
      // The backend highlights into one span list per line, indexed the same
      // way this splits. A line it couldn't classify is just one classless span;
      // the spans come from the same clamped string as `content`, so they cannot
      // disagree with it.
      const hl = s.highlight;
      const out = [];
      for (let i = 0; i < lines.length; i++) {
        const n = i + 1;
        const cur = n === s.cursor?.line;
        const text = spansHtml((hl && hl[i]) || [['', lines[i]]], cur ? s.cursor.column : null);
        out.push(`<div class="cl${cur ? ' cur' : ''}"><span class="n">${n}</span><span class="t">${text}</span></div>`);
      }
      return out.join('');
    }

    /**
     * One highlighted line. The caret is spliced into whichever span holds the
     * cursor's column rather than wrapped around the line, so it lands between
     * two characters instead of displacing them.
     */
    function spansHtml(spans, column) {
      let out = '';
      let col = 1;           // 1-based column where the next span starts
      let placed = column == null;
      for (const [cls, text, changed] of spans) {
        // A third element marks the part of an edited line that changed; it is
        // a class on the same span, so the caret can still split it.
        const names = [cls && `hl-${cls}`, changed && 'wd'].filter(Boolean).join(' ');
        const open = names ? `<span class="${names}">` : '';
        const close = names ? '</span>' : '';
        if (!placed && column < col + text.length) {
          const at = Math.max(0, column - col);
          out += open + esc(text.slice(0, at)) + '<span class="caret"></span>'
            + esc(text.slice(at)) + close;
          placed = true;
        } else {
          out += open + esc(text) + close;
        }
        col += text.length;
      }
      // A cursor sitting past the last character has no span to live in.
      return placed ? out : out + '<span class="caret"></span>';
    }


    /**
     * The student's working changes, as hunks against their last commit.
     *
     * Highlighted like the file view, because added-or-removed is carried by
     * the row's background and leaves the foreground free. Each row arrives
     * with its own sign, line numbers and spans, so there is nothing to look up
     * or count here — the backend did that once, when the snapshot arrived.
     */
    function diffHtml(s) {
      const d = s.baseline;
      if (d.kind !== 'head' || !d.hunks.length) return null;
      const out = [];
      for (const h of d.hunks) {
        out.push(`<div class="dh">@@ -${h.oldStart},${h.oldLines} +${h.newStart},${h.newLines} @@</div>`);
        for (const r of h.rows) {
          const cls = r.sign === '+' ? 'add' : r.sign === '-' ? 'del' : 'ctx';
          out.push(`<div class="dl ${cls}"><span class="n">${r.old ?? ''}</span><span class="n">${r.new ?? ''}</span>`
            + `<span class="t"><span class="sg">${r.sign}</span>${spansHtml(r.spans, null)}</span></div>`);
        }
      }
      return out.join('');
    }

    // ---- draggable board/dock divider ----
    (function () {
      const divider = document.getElementById('divider');
      let dragging = false;
      divider.addEventListener('pointerdown', (e) => {
        dragging = true; divider.classList.add('dragging');
        divider.setPointerCapture(e.pointerId); e.preventDefault();
      });
      divider.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const content = document.getElementById('content');
        const rect = content.getBoundingClientRect();
        const min = 240, max = rect.width - 280;
        const bx = Math.max(min, Math.min(max, e.clientX - rect.left));
        document.getElementById('board').style.flex = `0 0 ${bx}px`;
        document.getElementById('dock').style.flex = '1 1 0';
        relayout();
      });
      const end = (e) => {
        if (!dragging) return;
        dragging = false; divider.classList.remove('dragging');
        try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      divider.addEventListener('pointerup', end);
      divider.addEventListener('pointercancel', end);
    })();

    // ---- broadcast composer ----
    function openBroadcast() {
      if (!currentCourse) return;
      const opener = document.activeElement;
      const courseName = document.querySelector('#course option:checked')?.textContent || currentCourse;
      const max = 280;

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bc-title">
          <h2 id="bc-title">Broadcast message</h2>
          <p class="sub">To ${lastAudience} student${lastAudience === 1 ? '' : 's'} in ${esc(courseName)}</p>
          <textarea id="bc-text" maxlength="${max}" placeholder="Message to the class…" aria-label="Message to the class"></textarea>
          <div class="row">
            <span class="ct" id="bc-ct">0 / ${max}</span>
            <button class="btn" id="bc-cancel" type="button">Cancel</button>
            <button class="btn primary" id="bc-send" type="button" disabled>Send</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);

      const ta = backdrop.querySelector('#bc-text');
      const ct = backdrop.querySelector('#bc-ct');
      const send = backdrop.querySelector('#bc-send');
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };

      ta.focus();
      ta.addEventListener('input', () => {
        ct.textContent = `${ta.value.length} / ${max}`;
        send.disabled = ta.value.trim().length === 0;
      });
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#bc-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { close(); return; }
        if (e.key === 'Tab') { // simple focus trap
          const f = [...backdrop.querySelectorAll('textarea,button')].filter(x => !x.disabled);
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
      send.addEventListener('click', async () => {
        const text = ta.value.trim();
        if (!text) return;
        send.disabled = true; send.textContent = 'Sending…';
        try {
          const res = await fetch('/api/messages', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ course: currentCourse, text }),
          });
          if (res.ok) { close(); toast('Broadcast sent to the class'); }
          else { send.disabled = false; send.textContent = 'Send'; toast('Failed to send broadcast'); }
        } catch (_) { send.disabled = false; send.textContent = 'Send'; toast('Failed to send broadcast'); }
      });
    }

    // ---- create / link a course ----
    function openNewCourse() {
      const opener = document.activeElement;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nc-title">
          <h2 id="nc-title">New course</h2>
          <p class="sub">Create a course, or link an existing git repo as one.</p>
          <div class="field">
            <label for="nc-name">Name</label>
            <input type="text" id="nc-name" placeholder="Intro to Python" />
          </div>
          <div class="field">
            <label for="nc-repo">Repository <span class="desc">— optional; links a repo to this course</span></label>
            <input type="text" id="nc-repo" placeholder="https://github.com/org/intro-python" />
          </div>
          <div class="field">
            <label for="nc-slug">Slug <span class="desc">— optional; derived from the name or repo</span></label>
            <input type="text" id="nc-slug" placeholder="intro-python" />
          </div>
          <div class="field">
            <label class="toggle"><input type="checkbox" id="nc-seed" checked /> Seed exercises from the repo's folders <span class="desc">(GitHub)</span></label>
          </div>
          <div class="row">
            <span class="ct" id="nc-msg"></span>
            <button class="btn" id="nc-cancel" type="button">Cancel</button>
            <button class="btn primary" id="nc-create" type="button">Create</button>
          </div>
          <div id="nc-archived"></div>
        </div>`;
      document.body.appendChild(backdrop);

      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#nc-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      const name = backdrop.querySelector('#nc-name');
      name.focus();
      renderArchivedCourses(backdrop.querySelector('#nc-archived'));

      const create = backdrop.querySelector('#nc-create');
      const msg = backdrop.querySelector('#nc-msg');
      create.addEventListener('click', async () => {
        const payload = {
          name: name.value.trim(),
          slug: backdrop.querySelector('#nc-slug').value.trim(),
          repoUrl: backdrop.querySelector('#nc-repo').value.trim(),
          seedExercises: backdrop.querySelector('#nc-seed').checked,
        };
        if (!payload.name && !payload.slug && !payload.repoUrl) {
          msg.textContent = 'Enter a name, slug, or repo'; return;
        }
        msg.textContent = ''; create.disabled = true; create.textContent = 'Creating…';
        try {
          const res = await fetch('/api/courses', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (res.ok) {
            const c = await res.json();
            await reloadCourses(c.slug);
            close();
            const seeded = c.exercisesSeeded ? ` · ${c.exercisesSeeded} exercise${c.exercisesSeeded === 1 ? '' : 's'} seeded` : '';
            toast(`Course “${c.name}” created${seeded}`);
            if (c.seedNote) toast(`Exercises not seeded: ${c.seedNote}`);
            showEnrollmentToken(c);
          } else {
            const t = await res.text();
            create.disabled = false; create.textContent = 'Create';
            msg.textContent = t || 'Failed to create course';
          }
        } catch (_) {
          create.disabled = false; create.textContent = 'Create';
          msg.textContent = 'Failed to create course';
        }
      });
    }

    // Lists archived courses (if any) with one-click restore, inside the New
    // course modal — the natural place to manage the course catalog.
    async function renderArchivedCourses(host) {
      let archived;
      try {
        const res = await fetch('/api/courses?archived=1');
        if (!res.ok) return;
        archived = await res.json();
      } catch (_) { return; }
      if (!archived.length) return;
      host.innerHTML = `<hr><div class="field"><label>Archived courses</label>
        <ul class="archived-list">${archived.map(c =>
          `<li><span class="who">${esc(c.name)}</span><button class="btn" data-slug="${esc(c.slug)}" type="button">Restore</button></li>`
        ).join('')}</ul></div>`;
      host.querySelectorAll('button[data-slug]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true; btn.textContent = 'Restoring…';
          const ok = await patchCourse(btn.dataset.slug, { archived: false });
          if (ok) { btn.closest('li').remove(); await reloadCourses(btn.dataset.slug); toast('Course restored'); }
          else { btn.disabled = false; btn.textContent = 'Restore'; toast('Failed to restore'); }
        });
      });
    }

    // Shared PATCH /api/courses/{slug}. Returns true on success.
    async function patchCourse(slug, body) {
      try {
        const res = await fetch(`/api/courses/${encodeURIComponent(slug)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        return res.ok;
      } catch (_) { return false; }
    }

    // A course is only useful once students can enroll into it, so surface the
    // freshly minted enrollment token with a one-click copy.
    function showEnrollmentToken(c) {
      const opener = document.activeElement;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="et-title">
          <h2 id="et-title">Course created</h2>
          <p class="sub">Share this enrollment token so students (recorder / extension) can join ${esc(c.name)}.</p>
          <div class="field">
            <label for="et-token">Enrollment token</label>
            <input type="text" id="et-token" class="mono" readonly value="${esc(c.enrollmentToken || '')}" />
          </div>
          <div class="row">
            <span class="ct" id="et-msg"></span>
            <button class="btn" id="et-copy" type="button">Copy</button>
            <button class="btn primary" id="et-done" type="button">Done</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#et-done').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      const field = backdrop.querySelector('#et-token');
      field.focus(); field.select();
      backdrop.querySelector('#et-copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(c.enrollmentToken || ''); backdrop.querySelector('#et-msg').textContent = 'Copied'; }
        catch (_) { field.select(); backdrop.querySelector('#et-msg').textContent = 'Press ⌘/Ctrl+C'; }
      });
    }

    // ---- course settings (repo, enrollment token, teachers, archive) ----
    async function openCourseSettings() {
      if (!currentCourse) return;
      const slug = currentCourse;
      let c;
      try {
        const res = await fetch(`/api/courses/${encodeURIComponent(slug)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) { toast('Failed to load course settings'); return; }
        c = await res.json();
      } catch (_) { toast('Failed to load course settings'); return; }

      const opener = document.activeElement;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="cs-title">
          <h2 id="cs-title">Course settings</h2>
          <p class="sub">${esc(c.name)}</p>
          <div class="field">
            <label for="cs-name">Name</label>
            <input type="text" id="cs-name" value="${esc(c.name || '')}" />
          </div>
          <div class="field">
            <label for="cs-repo">Repository <span class="desc">— empty to unlink</span></label>
            <input type="text" id="cs-repo" value="${esc(c.repoUrl || '')}" placeholder="https://github.com/org/repo" />
          </div>
          <div class="field">
            <label for="cs-description">Description</label>
            <textarea id="cs-description" placeholder="What this course is about…">${esc(c.description || '')}</textarea>
          </div>
          <div class="field profile-grid">
            <div>
              <label for="cs-term">Term</label>
              <input type="text" id="cs-term" value="${esc(c.term || '')}" placeholder="Fall 2026" />
            </div>
            <div>
              <label for="cs-institution">Institution</label>
              <input type="text" id="cs-institution" value="${esc(c.institution || '')}" placeholder="Acme University" />
            </div>
            <div>
              <label for="cs-level">Level</label>
              <input type="text" id="cs-level" value="${esc(c.level || '')}" list="cs-levels" placeholder="Beginner" />
              <datalist id="cs-levels"><option value="Beginner"></option><option value="Intermediate"></option><option value="Advanced"></option></datalist>
            </div>
          </div>
          <div class="field">
            <label for="cs-token">Enrollment token</label>
            <input type="text" id="cs-token" class="mono" readonly value="${esc(c.enrollmentToken || '')}" />
            <div class="add-member">
              <button class="btn" id="cs-copy" type="button">Copy</button>
              <button class="btn" id="cs-rotate" type="button">Rotate…</button>
              <span class="ct" id="cs-token-msg"></span>
            </div>
          </div>
          <div class="field">
            <label>Teachers</label>
            <ul class="members" id="cs-members"></ul>
            <div class="add-member">
              <input type="text" id="cs-add" placeholder="username to add" />
              <button class="btn" id="cs-add-btn" type="button">Add</button>
            </div>
            <span class="ct" id="cs-member-msg"></span>
          </div>
          <div class="field">
            <label>Exercises</label>
            <button class="btn" id="cs-exercises" type="button">Edit exercises…</button>
          </div>
          <hr>
          <div class="row">
            <button class="btn danger" id="cs-archive" type="button">Archive course</button>
            <span class="ct" id="cs-msg"></span>
            <button class="btn" id="cs-cancel" type="button">Close</button>
            <button class="btn primary" id="cs-save" type="button">Save</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#cs-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      backdrop.querySelector('#cs-name').focus();

      // Members list, re-rendered after add/remove.
      let members = c.members || [];
      const memberMsg = backdrop.querySelector('#cs-member-msg');
      function renderMembers() {
        const ul = backdrop.querySelector('#cs-members');
        ul.innerHTML = members.map(u =>
          `<li><span class="who">${esc(u)}</span><button data-user="${esc(u)}" type="button" title="Remove ${esc(u)}" aria-label="Remove ${esc(u)}">✕</button></li>`
        ).join('');
        ul.querySelectorAll('button[data-user]').forEach(btn => btn.addEventListener('click', async () => {
          const user = btn.dataset.user;
          if (members.length <= 1) { memberMsg.textContent = "Can't remove the last teacher"; return; }
          btn.disabled = true;
          try {
            const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/members/${encodeURIComponent(user)}`, { method: 'DELETE' });
            if (res.ok) { members = members.filter(m => m !== user); renderMembers(); memberMsg.textContent = ''; }
            else { btn.disabled = false; memberMsg.textContent = (await res.text()) || 'Failed to remove'; }
          } catch (_) { btn.disabled = false; memberMsg.textContent = 'Failed to remove'; }
        }));
      }
      renderMembers();

      backdrop.querySelector('#cs-add-btn').addEventListener('click', async () => {
        const input = backdrop.querySelector('#cs-add');
        const username = input.value.trim();
        if (!username) return;
        memberMsg.textContent = '';
        try {
          const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/members`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username }),
          });
          if (res.ok) { if (!members.includes(username)) members.push(username); members.sort(); renderMembers(); input.value = ''; }
          else { memberMsg.textContent = (await res.text()) || 'Failed to add'; }
        } catch (_) { memberMsg.textContent = 'Failed to add'; }
      });

      const tokenField = backdrop.querySelector('#cs-token');
      backdrop.querySelector('#cs-copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(tokenField.value); backdrop.querySelector('#cs-token-msg').textContent = 'Copied'; }
        catch (_) { tokenField.select(); backdrop.querySelector('#cs-token-msg').textContent = 'Press ⌘/Ctrl+C'; }
      });
      backdrop.querySelector('#cs-rotate').addEventListener('click', async () => {
        if (!confirm('Rotate the enrollment token? Students using the old token will need the new one.')) return;
        try {
          const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/rotate-token`, { method: 'POST' });
          if (res.ok) { const j = await res.json(); tokenField.value = j.enrollmentToken; backdrop.querySelector('#cs-token-msg').textContent = 'Rotated'; }
          else { backdrop.querySelector('#cs-token-msg').textContent = 'Failed to rotate'; }
        } catch (_) { backdrop.querySelector('#cs-token-msg').textContent = 'Failed to rotate'; }
      });

      backdrop.querySelector('#cs-exercises').addEventListener('click', () => openExercisesEditor(slug, c.name));

      backdrop.querySelector('#cs-archive').addEventListener('click', async () => {
        if (!confirm(`Archive “${c.name}”? It keeps all its data but drops out of the switcher. You can restore it from New course.`)) return;
        const ok = await patchCourse(slug, { archived: true });
        if (ok) { close(); await reloadCourses(null); toast('Course archived'); }
        else { toast('Failed to archive'); }
      });

      const save = backdrop.querySelector('#cs-save');
      save.addEventListener('click', async () => {
        save.disabled = true; save.textContent = 'Saving…';
        const ok = await patchCourse(slug, {
          name: backdrop.querySelector('#cs-name').value.trim(),
          repoUrl: backdrop.querySelector('#cs-repo').value.trim(),
          description: backdrop.querySelector('#cs-description').value.trim(),
          term: backdrop.querySelector('#cs-term').value.trim(),
          institution: backdrop.querySelector('#cs-institution').value.trim(),
          level: backdrop.querySelector('#cs-level').value.trim(),
        });
        if (ok) { close(); await reloadCourses(slug); toast('Course settings saved'); }
        else { save.disabled = false; save.textContent = 'Save'; backdrop.querySelector('#cs-msg').textContent = 'Failed to save'; }
      });
    }

    // ---- exercises editor ----
    // Exercises are edited as plain lines "slug: Title" (one per line); line order
    // is the display order. Saving replaces the course's exercise list exactly.
    function parseExerciseLines(text) {
      return text.split('\n').map(l => l.trim()).filter(Boolean).map((line, i) => {
        const idx = line.indexOf(':');
        const slug = (idx < 0 ? line : line.slice(0, idx)).trim();
        const title = idx < 0 ? '' : line.slice(idx + 1).trim();
        return { slug, title: title || slug, position: i };
      }).filter(e => e.slug);
    }
    function exercisesToLines(list) {
      return (list || []).map(e => e.title && e.title !== e.slug ? `${e.slug}: ${e.title}` : e.slug).join('\n');
    }

    async function openExercisesEditor(slug, courseName) {
      let list;
      try {
        const res = await fetch(`/api/exercises?course=${encodeURIComponent(slug)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) { toast('Failed to load exercises'); return; }
        list = await res.json();
      } catch (_) { toast('Failed to load exercises'); return; }

      const opener = document.activeElement;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ex-title">
          <h2 id="ex-title">Exercises</h2>
          <p class="sub">For ${esc(courseName || slug)} — one per line, in order. Matches the names in the repo's <code>.hermione.json</code>.</p>
          <div class="field">
            <label for="ex-text">Exercises <span class="desc">— slug: Title (title optional)</span></label>
            <textarea id="ex-text" class="mono" placeholder="ex1: Pointers &amp; memory&#10;ex2: Strings">${esc(exercisesToLines(list))}</textarea>
          </div>
          <div class="row">
            <span class="ct" id="ex-msg"></span>
            <button class="btn" id="ex-cancel" type="button">Cancel</button>
            <button class="btn primary" id="ex-save" type="button">Save</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#ex-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      const ta = backdrop.querySelector('#ex-text');
      ta.focus();

      const save = backdrop.querySelector('#ex-save');
      save.addEventListener('click', async () => {
        save.disabled = true; save.textContent = 'Saving…';
        const exercises = parseExerciseLines(ta.value);
        try {
          const res = await fetch('/api/exercises', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ course: slug, exercises, replace: true }),
          });
          if (res.ok) {
            close();
            toast(`Exercises saved (${exercises.length})`);
            if (slug === currentCourse) refresh();
          } else {
            const t = await res.text();
            save.disabled = false; save.textContent = 'Save';
            backdrop.querySelector('#ex-msg').textContent = t || 'Failed to save';
          }
        } catch (_) {
          save.disabled = false; save.textContent = 'Save';
          backdrop.querySelector('#ex-msg').textContent = 'Failed to save';
        }
      });
    }

    // ---- AI assistant settings ----
    // Skills/MCP are edited as plain lines and parsed to the API's shapes.
    function parseSkills(text) {
      return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
        const [kind, skillId, version] = line.split(':').map(p => p.trim());
        const o = { type: kind || 'anthropic', skillId: skillId || '' };
        if (version) o.version = version;
        return o;
      }).filter(s => s.skillId);
    }
    function skillsToText(skills) {
      return (skills || []).map(s => [s.type, s.skillId, s.version].filter(Boolean).join(':')).join('\n');
    }
    function parseMcp(text) {
      return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
        const i = line.indexOf(' ');
        return i < 0 ? null : { name: line.slice(0, i).trim(), url: line.slice(i + 1).trim() };
      }).filter(Boolean);
    }
    function mcpToText(servers) {
      return (servers || []).map(s => `${s.name} ${s.url}`).join('\n');
    }

    async function openAssistantSettings() {
      if (!currentCourse) return;
      let cfg;
      try {
        const res = await fetch(`/api/assistant?course=${encodeURIComponent(currentCourse)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        cfg = await res.json();
      } catch (_) { toast('Failed to load assistant settings'); return; }

      const opener = document.activeElement;
      const courseName = document.querySelector('#course option:checked')?.textContent || currentCourse;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="as-title">
          <h2 id="as-title">AI assistant</h2>
          <p class="sub">For ${esc(courseName)}</p>
          ${cfg.available ? '' : '<div class="notice warn">No Anthropic API key is configured on the server, so the assistant cannot be enabled. Set HERMIONE_ANTHROPIC_API_KEY.</div>'}
          <div class="field">
            <label class="toggle"><input type="checkbox" id="as-enabled" ${cfg.enabled ? 'checked' : ''} ${cfg.available ? '' : 'disabled'} /> Enable the assistant for this course</label>
          </div>
          <div class="field">
            <label for="as-model">Model</label>
            <input type="text" id="as-model" value="${esc(cfg.model || '')}" />
          </div>
          <div class="field">
            <label for="as-system">System prompt <span class="desc">— how it should help (tone, how much to reveal)</span></label>
            <textarea id="as-system" placeholder="You are a patient teaching assistant. Guide students with hints; don't hand over full solutions.">${esc(cfg.systemPrompt || '')}</textarea>
          </div>
          <div class="field">
            <label for="as-skills">Skills <span class="desc">— one per line: type:skill_id[:version], e.g. anthropic:pdf</span></label>
            <textarea id="as-skills" class="mono" placeholder="anthropic:pdf">${esc(skillsToText(cfg.skills))}</textarea>
          </div>
          <div class="field">
            <label for="as-mcp">MCP servers <span class="desc">— one per line: name url (public servers only)</span></label>
            <textarea id="as-mcp" class="mono" placeholder="docs https://mcp.example.com/sse">${esc(mcpToText(cfg.mcpServers))}</textarea>
          </div>
          <div class="row">
            <span class="ct">${cfg.configured ? 'Agent synced' : 'Not synced yet'}</span>
            <button class="btn" id="as-cancel" type="button">Cancel</button>
            <button class="btn primary" id="as-save" type="button">Save</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#as-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      backdrop.querySelector('#as-system').focus();

      const save = backdrop.querySelector('#as-save');
      save.addEventListener('click', async () => {
        const payload = {
          course: currentCourse,
          enabled: backdrop.querySelector('#as-enabled').checked,
          model: backdrop.querySelector('#as-model').value.trim(),
          systemPrompt: backdrop.querySelector('#as-system').value,
          skills: parseSkills(backdrop.querySelector('#as-skills').value),
          mcpServers: parseMcp(backdrop.querySelector('#as-mcp').value),
        };
        save.disabled = true; save.textContent = 'Saving…';
        try {
          const res = await fetch('/api/assistant', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (res.ok) { close(); toast('Assistant settings saved'); }
          else { const t = await res.text(); save.disabled = false; save.textContent = 'Save'; toast(t || 'Failed to save'); }
        } catch (_) { save.disabled = false; save.textContent = 'Save'; toast('Failed to save'); }
      });
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });
    document.getElementById('broadcast').addEventListener('click', openBroadcast);
    document.getElementById('new-course').addEventListener('click', openNewCourse);
    document.getElementById('course-settings').addEventListener('click', openCourseSettings);
    document.getElementById('assistant-settings').addEventListener('click', openAssistantSettings);

    (async () => {
      if (localStorage.getItem(HINT_KEY)) document.getElementById('hint').style.display = 'none';
      setFreshness();
      await loadCourses();
      let storedView = null;
      try { storedView = localStorage.getItem(VIEW_KEY); } catch (_) {}
      currentView = storedView === 'tree' ? 'tree' : 'board';
      for (const b of document.querySelectorAll('#view-toggle button')) {
        b.setAttribute('aria-pressed', String(b.dataset.view === currentView));
        b.addEventListener('click', () => setView(b.dataset.view));
      }

      await refresh();
      setInterval(refresh, 3000);
    })();
  </script>
</body>
</html>
