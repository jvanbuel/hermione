<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermione — Class Overview</title>
  <!-- Apply the saved theme before first paint so the page never flashes the
       wrong colours. No saved choice → falls through to prefers-color-scheme. -->
  <script>
    try {
      var t = localStorage.getItem('hermione.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/hermione-mark.svg" />
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <style>
    body {
      display: flex; flex-direction: column;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base); line-height: 1.4;
      font-variant-numeric: tabular-nums;
      background: var(--bg); color: var(--fg);
    }

    .ico { width: 1em; height: 1em; vertical-align: -0.125em; flex: none; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px; border-bottom: 1px solid var(--border-subtle); background: var(--surface);
      flex: 0 0 auto;
    }
    /* The mark and wordmark are one link back to the board. Keeping the
     * original 10px header gap between them means the layout is unchanged. */
    /* Segmented Board/Tree switch — one control, two states. */
    #view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    #view-toggle button {
      display: inline-flex; align-items: center; gap: 5px; border: 0; border-radius: 0;
      background: none; color: var(--fg-muted); font: inherit; font-size: var(--fs-sm);
      padding: 5px 9px; cursor: pointer;
    }
    #view-toggle button + button { border-left: 1px solid var(--border); }
    #view-toggle button:hover { background: var(--surface-2); }
    #view-toggle button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }

    header .home { display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none; color: inherit; border-radius: var(--radius-sm); }
    header .home:hover h1 { text-decoration: underline; }
    header .logo-mark { width: 24px; height: 24px; flex: none; border-radius: 50%;
      object-fit: contain; box-shadow: var(--shadow-1); }
    header h1 { font-size: var(--fs-lg); margin: 0; font-weight: 600; }
    header select {
      background: var(--bg); color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; font-size: var(--fs-sm);
    }
    header .spacer { margin-left: auto; }
    .hint { font-size: var(--fs-sm); color: var(--fg-subtle); }
    .freshness {
      font-size: var(--fs-sm); color: var(--fg-subtle);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .freshness.stale { color: var(--amber); }
    .freshness.failed { color: var(--red-text); }
    .freshness .fdot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
    /* Controls keep their size; only the hint gives way when the bar is full.
     * Without this every item shrinks at once and the header grows to two or
     * three lines of squeezed text. */
    header button, header a.nav, #view-toggle, #alert, header select, #freshness { flex: none; }
    #freshness { white-space: nowrap; }
    header #alert:not(:empty) { white-space: nowrap; }
    .hint { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    header button, header a.nav {
      background: var(--surface-2); color: var(--fg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 5px 10px; font-size: var(--fs-sm); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      box-shadow: var(--shadow-1);
      transition: background .12s var(--ease), border-color .12s var(--ease), color .12s var(--ease);
    }
    header button:hover, header a.nav:hover { background: var(--border); }
    /* Broadcast is the header's primary action — filled, so it leads the eye. */
    #broadcast { background: var(--green); border-color: transparent; color: #fff; font-weight: 600; }
    #broadcast:hover { background: var(--green-emphasis); }
    /* A hairline groups the read-only nav (Analytics/Transcripts) apart from
     * the write actions (Assistant/Broadcast). */
    #nav-sep { width: 1px; align-self: stretch; margin: 2px 2px; background: var(--border-subtle); }
    /* Icon-only theme toggle: square, no text. */
    #theme-toggle { padding: 5px; }
    #theme-toggle .ico { width: 16px; height: 16px; }
    /* Icon-only "new course" + "course settings" buttons, with the switcher. */
    #new-course, #course-settings { padding: 5px; }
    #new-course .ico, #course-settings .ico { width: 15px; height: 15px; }
    /* Linked-repo chip next to the switcher. */
    .course-repo { font-size: var(--fs-sm); color: var(--fg-muted); text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px; max-width: 220px; }
    .course-repo:hover { color: var(--fg); text-decoration: underline; }
    .course-repo.unlinked { cursor: default; }
    .course-repo.unlinked:hover { color: var(--fg-muted); text-decoration: none; }
    .course-repo .ico { width: 14px; height: 14px; flex: none; }
    .course-repo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Members editor in the course-settings modal. */
    .members { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .members li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--bg); }
    .members li .who { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .members li .you { color: var(--fg-subtle); font-size: var(--fs-xs); }
    .members li button { background: none; border: none; color: var(--fg-subtle); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: var(--fs-base); }
    .members li button:hover { color: var(--red-text); background: var(--surface-2); }
    .modal .profile-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .modal .profile-grid > div > label { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: 4px; }
    .add-member { display: flex; gap: 8px; margin-top: 8px; }
    .add-member input { flex: 1 1 auto; }
    .modal .archived-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .modal .archived-list li { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); }
    .modal .archived-list li .who { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal .danger { color: var(--red-text); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
    .modal .danger:hover { background: var(--help-wash); }
    .modal hr { border: none; border-top: 1px solid var(--border-subtle); margin: 16px 0 4px; }
    /* The at-a-glance alarm: a real badge, not just red text. */
    #alert:not(:empty) { font-size: var(--fs-sm); color: var(--red-text); font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
      background: var(--help-wash); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent);
      border-radius: var(--radius-pill); }
    #alert .alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 70%, transparent); animation: alert-pulse 2s var(--ease) infinite; }
    @keyframes alert-pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 55%, transparent); }
      70% { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    #content { flex: 1 1 auto; display: flex; min-height: 0; }

    /* ---- Overview board (main pane) ---- */
    #board {
      flex: 1 1 0; min-width: 0; overflow-x: auto;
      display: flex; gap: 16px; padding: 16px; align-items: flex-start;
    }
    /* ---- Tree view: the repo, pruned to what people actually have open ---- */
    /* The grid lives on the container, and each row is display:contents, so the
     * name column lines up across every row however deep the path goes. */
    #board.tree {
      display: grid;
      /* Both columns sized to content but floored, so the block is centred and
       * its left edge stays put as paths and names change length — a tree that
       * slid sideways on every refresh would be worse than one hugging the
       * edge. The old `1fr` second column ate the whole viewport, which is why
       * the tree read as a fragment against dead space. */
      grid-template-columns: max-content max-content;
      justify-content: center; align-content: start;
      column-gap: 8px; padding: 32px 24px 48px; overflow: auto;
    }
    #board.tree .trow { display: contents; }
    #board.tree .tpath {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: var(--fs-base); white-space: pre; padding: 2px 0;
      color: var(--fg); align-self: start;
    }
    /* The connectors are scaffolding — keep them quiet so the names carry. */
    #board.tree .branch { color: var(--fg-subtle); }
    #board.tree .tpath.dir .tname { color: var(--fg-muted); font-weight: 600; }
    #board.tree .trow.root .tpath { padding-bottom: 18px; }
    #board.tree .trow.root .tpath .tname { color: var(--fg); }
    #board.tree .tpeople {
      position: relative; display: flex; flex-direction: column;
      align-items: flex-start; gap: 1px; padding-left: 22px; min-width: 0;
    }
    /* The vertical stops at the last name's centre, so the line ends on a
     * person rather than running past them into empty space. */
    #board.tree .tpeople::before {
      content: ""; position: absolute; left: 6px; top: 0; bottom: 14px;
      border-left: 1px solid var(--border);
    }
    /* No people, no line — otherwise every folder row trails a rule into space. */
    #board.tree .tpeople:empty::before { content: none; }
    #board.tree .tperson::before {
      content: ""; position: absolute; left: -16px; top: 50%;
      width: 13px; border-top: 1px solid var(--border);
    }
    #board.tree .tperson {
      position: relative;
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      background: none; border: 1px solid transparent; border-radius: var(--radius-pill);
      color: var(--fg); font: inherit; font-size: var(--fs-base); padding: 2px 8px 2px 2px;
      cursor: pointer; text-align: left;
    }
    #board.tree .tperson:hover { background: var(--surface-2); border-color: var(--border); }
    #board.tree .tperson .avatar { width: 22px; height: 22px; font-size: 10px; }
    #board.tree .tperson .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #board.tree .tperson.help { color: var(--red-text); }
    #board.tree .tperson.watch { color: var(--amber); }
    /* A file nobody is in still needs a row height, or the grid collapses. */
    #board.tree .tpeople:empty::after { content: ""; display: block; height: 24px; }

    .column {
      flex: 0 0 264px; background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius); max-height: 100%; display: flex; flex-direction: column;
      box-shadow: var(--shadow-1);
    }
    .column > h2 {
      font-size: var(--fs-sm); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: 8px; font-weight: 600;
    }
    .column > h2 .col-title { display: inline-flex; align-items: center; gap: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .column.unassigned > h2 { color: var(--fg-muted); }
    .count { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-muted); font-weight: 600;
      background: var(--border-subtle); padding: 1px 9px; border-radius: var(--radius-pill); flex: none;
      min-width: 22px; text-align: center; }
    .summary { padding: 6px 14px 8px; font-size: var(--fs-sm); color: var(--fg-muted);
      border-bottom: 1px solid var(--border-subtle); }
    .summary .warn { color: var(--red-text); }
    .summary .muted { color: var(--fg-subtle); }
    .spark { display: block; margin-top: 7px; width: 100%; height: 22px; overflow: visible; }
    .spark .thr { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 2; }
    .cards { padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    /* Cards are real buttons: free keyboard operability + focus handling. */
    .card {
      font: inherit; color: inherit; text-align: left; width: 100%;
      display: flex; align-items: center; gap: 10px; padding: 8px;
      background: transparent; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid transparent; border-left-width: 3px;
      transition: background .12s var(--ease), border-color .12s var(--ease),
        box-shadow .12s var(--ease), transform .06s var(--ease);
    }
    .card:hover { background: var(--surface-2); border-color: var(--border); box-shadow: var(--shadow-1); }
    .card:active { transform: translateY(1px); }
    .card.open { border-color: var(--accent-text); box-shadow: 0 0 0 1px var(--accent-text) inset; }
    /* Struggle isn't only a left border — a faint wash makes "needs help" and
     * "watch" pop out of a full column at a glance, which is the whole job. */
    .card.struggle-help { border-left-color: var(--red-text); background: var(--help-wash); }
    .card.struggle-watch { border-left-color: var(--amber); background: var(--watch-wash); }
    .card.struggle-help:hover { background: color-mix(in srgb, var(--red) 20%, transparent); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
    .card.struggle-watch:hover { background: color-mix(in srgb, var(--amber) 20%, transparent); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
    .pill { font-size: var(--fs-xs); padding: 1px 8px; border-radius: var(--radius-pill); margin-left: 6px;
      font-weight: 600; flex: none; letter-spacing: .01em; box-shadow: var(--shadow-1); }
    .pill.help { background: var(--help-bg); color: #fff; }
    .pill.watch { background: var(--watch-bg); color: #fff; }
    .who .reason { font-size: var(--fs-sm); color: var(--amber); margin-top: 2px;
      display: flex; align-items: flex-start; gap: 4px; }
    .who .prov { font-size: var(--fs-xs); color: var(--fg-subtle); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .avatar {
      position: relative; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 700; color: #fff;
      user-select: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    }
    /* Status differs by FILL, not just hue — readable when colour isn't. */
    .avatar .dot {
      position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px;
      border-radius: 50%; box-sizing: border-box;
    }
    .dot.active { background: var(--green); border: 2px solid var(--surface); }
    .dot.idle { background: var(--surface); border: 2px solid var(--fg-subtle); }

    .who { min-width: 0; flex: 1; }
    .who .name { font-weight: 600; font-size: var(--fs-base); display: flex; align-items: center; min-width: 0; }
    .who .name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .who .file { color: var(--fg-muted); font-size: var(--fs-sm); font-family: ui-monospace, monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .time { font-size: var(--fs-sm); margin-top: 2px; color: var(--fg-muted); }
    .time .clock { color: var(--fg); display: inline-flex; align-items: center; gap: 4px; }
    .time .sep { color: var(--border); margin: 0 5px; }
    .time .typing { color: var(--green-text); display: inline-flex; align-items: center; gap: 4px; }

    .empty { margin: auto; color: var(--fg-muted); padding: 40px; text-align: center; }
    .empty.first-run { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .empty.first-run h2 { margin: 0; font-size: var(--fs-lg); color: var(--fg); font-weight: 600; }
    .empty.first-run p { margin: 0 0 8px; font-size: var(--fs-base); }

    #toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column;
      gap: 8px; z-index: 1000; }
    .toast { background: var(--accent); color: #fff; padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: var(--fs-base); box-shadow: var(--shadow-2); max-width: 320px;
      opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ---- Resizable divider between board and terminal dock ---- */
    #divider { flex: 0 0 6px; cursor: col-resize; background: var(--border-subtle); display: none; }
    #divider.active { display: block; }
    #divider:hover, #divider.dragging { background: var(--accent); }

    /* ---- Terminal dock (extra panes) ---- */
    #dock {
      flex: 1.5 1 0; min-width: 0;
      display: none; grid-auto-rows: 1fr; gap: 1px; background: var(--border-subtle);
    }
    #dock.active { display: grid; }
    .pane { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane > .pane-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; background: var(--surface); border-bottom: 1px solid var(--border-subtle);
      font-size: var(--fs-sm);
    }
    .pane-head .ex { color: var(--fg-muted); font-size: var(--fs-sm); }
    .pane-head .close {
      margin-left: auto; cursor: pointer; color: var(--fg-muted); border: none; background: none;
      font-size: var(--fs-lg); line-height: 1; padding: 2px 6px; border-radius: 5px;
    }
    .pane-head .close:hover { background: var(--border); color: var(--fg); }
    .pane > .term { flex: 1 1 auto; min-height: 0; padding: 6px 8px; }
    .pane .note { margin: auto; color: var(--fg-muted); font-size: var(--fs-base); padding: 24px; text-align: center; }

    /* ---- Broadcast composer (modal) ---- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(1,4,9,.6);
      display: grid; place-items: center; z-index: 2000; }
    .modal { width: 440px; max-width: calc(100vw - 32px); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px;
      box-shadow: var(--shadow-3); }
    .modal h2 { margin: 0 0 4px; font-size: var(--fs-lg); }
    .modal .sub { margin: 0 0 14px; color: var(--fg-muted); font-size: var(--fs-sm); }
    .modal textarea { width: 100%; min-height: 96px; resize: vertical; background: var(--bg);
      color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      font: inherit; font-size: var(--fs-base); }
    .modal .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .modal .ct { margin-right: auto; color: var(--fg-subtle); font-size: var(--fs-sm); }
    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--fg); font: inherit; font-size: var(--fs-sm); cursor: pointer; }
    .btn:hover { background: var(--border); }
    .btn.primary { background: var(--green); border-color: transparent; color: #fff; font-weight: 600; }
    .btn.primary:hover { background: var(--green-emphasis); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---- Assistant settings form (modal) ---- */
    .modal.wide { width: 540px; }
    .modal .field { margin-top: 12px; }
    .modal .field > label { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: 4px; }
    .modal .field .desc { font-weight: 400; color: var(--fg-subtle); font-size: var(--fs-xs); }
    .modal input[type="text"] {
      width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font: inherit; font-size: var(--fs-base);
    }
    .modal textarea.mono { font-family: ui-monospace, monospace; min-height: 64px; }
    .modal input.mono { font-family: ui-monospace, monospace; }
    .modal .toggle { display: flex; align-items: center; gap: 8px; font-size: var(--fs-base); cursor: pointer; }
    .modal .toggle input { width: 16px; height: 16px; }
    .modal .notice { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-sm);
      background: var(--surface-2); color: var(--fg-muted); }
    .modal .notice.warn { color: var(--amber); }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to the board">
      <img class="logo-mark" src="/assets/hermione-mark.svg" alt="" aria-hidden="true" />
      <h1>Hermione</h1>
    </a>
    <label class="visually-hidden" for="course">Course</label>
    <select id="course" title="Course"></select>
    <button id="new-course" type="button" title="Create a new course or link a repo" aria-label="Create a new course">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8.75 2.5a.75.75 0 0 0-1.5 0v4.75H2.5a.75.75 0 0 0 0 1.5h4.75v4.75a.75.75 0 0 0 1.5 0V8.75h4.75a.75.75 0 0 0 0-1.5H8.75V2.5z"/></svg>
    </button>
    <button id="course-settings" type="button" title="Course settings — repo, enrollment token, teachers" aria-label="Course settings">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 4.5h6.1a2 2 0 0 0 3.8 0H14V3h-2.1a2 2 0 0 0-3.8 0H2v1.5zM2 8.75h2.1a2 2 0 0 0 3.8 0H14v-1.5H7.9a2 2 0 0 0-3.8 0H2v1.5zM2 13h6.1a2 2 0 0 0 3.8 0H14v-1.5h-2.1a2 2 0 0 0-3.8 0H2V13z"/></svg>
    </button>
    <a id="course-repo" class="course-repo" target="_blank" rel="noopener" title="Open the linked repository" style="display:none">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      <span id="course-repo-name"></span>
    </a>
    <div id="view-toggle" role="group" aria-label="View">
      <button type="button" data-view="board" aria-pressed="true" aria-label="Board view" title="Board — students grouped by exercise">
        <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.5 2h4v12h-4V2zm5 0h4v7h-4V2zm5 0h4v10h-4V2z"/></svg>
      </button>
      <button type="button" data-view="tree" aria-pressed="false" aria-label="Tree view" title="Tree — the files everyone has open">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 1.5v10.5h4M3 6.5h4M11 2.2h3.2M11 7.2h3.2M11 12.2h3.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <span id="alert" aria-live="assertive"></span>
    <span class="spacer"></span>
    <span id="freshness" class="freshness">Connecting…</span>
    <span id="hint" class="hint">Click a student to open their terminal</span>
    <button id="theme-toggle" type="button" title="Toggle light / dark theme" aria-label="Toggle light or dark theme"></button>
    <a class="nav" href="/analytics" title="Time-on-task analytics">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 13.5h12v1.3H1V2h1.3v11.5zM5 11V7h1.6v4H5zm3-6h1.6v6H8V5zm3 2.5h1.6V11H11V7.5z"/></svg>
      Analytics
    </a>
    <a class="nav" href="/transcripts" title="Read student conversations with the assistant">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h12a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H6l-3 3v-3H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm2 3v1.3h8V5H4zm0 2.7V9h5V7.7H4z"/></svg>
      Transcripts
    </a>
    <span id="nav-sep" aria-hidden="true"></span>
    <button id="assistant-settings" type="button" title="Configure the AI teaching assistant for this course">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 1h4l.4 2.1 1.4.8 2-.8 2 3.4-1.6 1.4v1.6L15.2 11l-2 3.4-2-.8-1.4.8L10 16H6l-.4-2.6-1.4-.8-2 .8L.2 10l1.6-1.4V7L.2 5.6l2-3.4 2 .8 1.4-.8zM8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5z"/></svg>
      Assistant
    </button>
    <button id="broadcast" type="button" title="Send a message to all students in this course">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.5 2.2 4.6 5.5H2.3A1.3 1.3 0 0 0 1 6.8v2.4a1.3 1.3 0 0 0 1.3 1.3h.6l1 3.2h2l-.9-3.2 6.5 3V2.2zM13.8 6a2 2 0 0 1 0 4V6z"/></svg>
      Broadcast
    </button>
    <button id="logout" type="button" title="Sign out">Sign out</button>
  </header>
  <div id="content">
    <div id="board"><div class="empty">Loading…</div></div>
    <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize terminal panel"></div>
    <div id="dock"></div>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script>
    // xterm palettes per theme — kept in step with --bg / --fg in tokens.css so
    // the embedded terminals match the page chrome (dark = chalkboard slate).
    const TERM_THEMES = {
      dark:  { background: '#243831', foreground: '#eef1e6', cursor: '#eef1e6' },
      light: { background: '#ffffff', foreground: '#1f2328', cursor: '#1f2328' },
    };
    const openPanes = new Map(); // student -> { term, fit, es, el }
    // Struggle thresholds (seconds) — mirror the backend so the sparkline marks
    // the same watch/help lines the server uses to flag students.
    const WATCH_SECS = 10 * 60, HELP_SECS = 25 * 60;
    const HINT_KEY = 'hermione.hintSeen';

    const ICONS = {
      book: '<svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 1H13v11H4.5a1.5 1.5 0 0 0-1.5 1.5V2.5A1.5 1.5 0 0 1 4.5 1zM3 13.5A1.5 1.5 0 0 1 4.5 12H13v3H4.5A1.5 1.5 0 0 1 3 13.5z"/></svg>',
      clock: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      warn: '<svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.6 15 14H1L8 1.6zM7.3 6h1.4v3.6H7.3V6zm0 4.6h1.4V12.2H7.3v-1.6z"/></svg>',
      pencil: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M11.2 2.3 13.7 4.8 5.6 12.9 2.4 13.6l.7-3.2 8.1-8.1z"/></svg>',
      close: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
      sun: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.8M8 13.2V15M1 8h1.8M13.2 8H15M3 3l1.3 1.3M11.7 11.7 13 13M13 3l-1.3 1.3M4.3 11.7 3 13"/></svg>',
      moon: '<svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.2 2.3a5.8 5.8 0 1 0 7.5 7.5A4.7 4.7 0 0 1 6.2 2.3z"/></svg>',
    };

    // ---- which view of the class is on screen ----
    const VIEW_KEY = 'hermione.view';
    let currentView = 'board';
    function setView(view) {
      currentView = (view === 'tree') ? 'tree' : 'board';
      try { localStorage.setItem(VIEW_KEY, currentView); } catch (_) {}
      for (const b of document.querySelectorAll('#view-toggle button')) {
        b.setAttribute('aria-pressed', String(b.dataset.view === currentView));
      }
      // The two views share #board but lay it out completely differently, so a
      // switch has to start from an empty container rather than reconcile
      // columns into rows.
      document.getElementById('board').replaceChildren();
      if (lastOverview) renderView(lastOverview);
    }

    // ---- the course being watched, remembered across reloads ----
    // A teacher watching one class all morning should not be dropped back onto
    // whichever course happens to sort first every time the page reloads.
    const COURSE_KEY = 'hermione.course';
    function rememberCourse(slug) {
      currentCourse = slug;
      try {
        if (slug) localStorage.setItem(COURSE_KEY, slug);
        else localStorage.removeItem(COURSE_KEY);
      } catch (_) { /* private mode — the switcher still works, it just forgets */ }
    }
    function rememberedCourse() {
      try { return localStorage.getItem(COURSE_KEY); } catch (_) { return null; }
    }

    // ---- theme: OS default + manual override (dark "chalkboard" / light) ----
    const THEME_KEY = 'hermione.theme';
    const lightMQ = window.matchMedia('(prefers-color-scheme: light)');
    // Effective theme: an explicit data-theme wins; otherwise follow the OS.
    function effectiveTheme() {
      const pinned = document.documentElement.dataset.theme;
      if (pinned === 'light' || pinned === 'dark') return pinned;
      return lightMQ.matches ? 'light' : 'dark';
    }
    function termTheme() { return TERM_THEMES[effectiveTheme()]; }
    // Reflect the live theme into the toggle icon and any open terminals.
    function applyTheme() {
      const t = effectiveTheme();
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
        btn.title = t === 'dark' ? 'Switch to light theme' : 'Switch to chalkboard theme';
      }
      openPanes.forEach(p => { if (p.term) p.term.options.theme = termTheme(); });
    }
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
      applyTheme();
    }
    // When the teacher hasn't pinned a theme, track OS changes live.
    lightMQ.addEventListener('change', () => {
      if (!document.documentElement.dataset.theme) applyTheme();
    });

    // ---- helpers ----
    function hashHue(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
      return h;
    }
    function initials(name) {
      const parts = name.split(/[\s._:\-]+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }
    function avatarHtml(name, status, extraClass = '') {
      const hue = hashHue(name);
      // Muted fill so per-student colour aids recognition without competing with
      // the semantic red/amber struggle language.
      return `<div class="avatar ${extraClass}" aria-hidden="true" style="background:hsl(${hue},26%,38%)">
        ${esc(initials(name))}<span class="dot ${status}" title="${status}"></span></div>`;
    }
    function fmtDuration(secs) {
      if (secs < 60) return `${secs}s`;
      const m = Math.floor(secs / 60), s = secs % 60;
      if (m < 60) return s ? `${m}m ${s}s` : `${m}m`;
      const h = Math.floor(m / 60);
      return `${h}h ${String(m % 60).padStart(2, '0')}m`;
    }
    function timeAgo(ms) {
      const s = Math.round((Date.now() - ms) / 1000);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.round(s / 60)}m ago`;
      return `${Math.round(s / 3600)}h ago`;
    }
    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    // Escape untrusted strings (student names, file paths, exercises, course
    // names) before putting them in HTML — they originate from students.
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Keyed, in-place reconciliation of a container's children, so the 3s
    // refresh never wipes the DOM — scroll position, focus, and hover survive.
    function reconcile(parent, items, keyOf, create, update) {
      const byKey = new Map();
      for (const n of Array.from(parent.children)) {
        if (n.dataset && n.dataset.key != null) byKey.set(n.dataset.key, n);
        else n.remove(); // drop non-keyed placeholders (e.g. the empty state)
      }
      const desired = items.map(item => {
        const key = String(keyOf(item));
        let n = byKey.get(key);
        if (n) byKey.delete(key);
        else { n = create(item); n.dataset.key = key; }
        update(n, item);
        return n;
      });
      for (const n of byKey.values()) n.remove();
      desired.forEach((n, i) => {
        if (parent.children[i] !== n) parent.insertBefore(n, parent.children[i] || null);
      });
    }

    // ---- board rendering ----
    function cardInner(s) {
      const pill = s.struggle === 'help' ? '<span class="pill help">needs help</span>'
                 : s.struggle === 'watch' ? '<span class="pill watch">watch</span>' : '';
      const reason = (s.struggleReasons && s.struggleReasons.length)
        ? `<div class="reason">${ICONS.warn}<span>${esc(s.struggleReasons.join(' · '))}</span></div>` : '';
      // Recent typing is the counterweight to the clock: a long time on an
      // exercise reads very differently when the student is still writing code.
      // The edit window is longer than the active window, so gate on status too
      // — someone who left four minutes ago is not "typing".
      const typing = s.status === 'active' && s.editsRecent > 0
        ? `<span class="sep">·</span><span class="typing" title="${s.editsRecent} edits in the last few minutes">${ICONS.pencil}typing</span>` : '';
      const prov = (s.studentSource || s.repo)
        ? `<div class="prov" title="identity provenance">${esc(s.studentSource || '?')}${s.repo ? ` · ${esc(s.repo)}` : ''}</div>` : '';
      return `
        ${avatarHtml(s.student, s.status)}
        <div class="who">
          <div class="name"><span class="nm">${esc(s.student)}</span>${pill}</div>
          <div class="file">${esc(s.file || '—')}</div>
          ${prov}
          ${reason}
          <div class="time">
            <span class="clock">${ICONS.clock}${fmtDuration(s.secondsOnExercise)}</span>
            <span class="sep">·</span><span>${timeAgo(s.lastSeenUnixMs)}</span>
            ${typing}
          </div>
        </div>`;
    }
    function createCard() {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      // Bound once, not per refresh; reads its live data-* on click.
      b.addEventListener('click', () =>
        openTerminal(b.dataset.student, b.dataset.session || null, b.dataset.exercise || null));
      return b;
    }
    function updateCard(b, s) {
      b.dataset.student = s.student;
      b.dataset.session = s.terminalSessionId || '';
      b.dataset.exercise = s.exercise || '';
      b.classList.toggle('open', openPanes.has(s.student));
      b.classList.toggle('struggle-help', s.struggle === 'help');
      b.classList.toggle('struggle-watch', s.struggle === 'watch');
      const label = `${s.student}, ${s.exercise || 'no exercise'}, ${s.status}`
        + (s.struggle === 'help' ? ', needs help' : s.struggle === 'watch' ? ', watch' : '');
      b.setAttribute('aria-label', label);
      b.innerHTML = cardInner(s);
    }

    // A compact distribution strip of time-on-exercise across the group, with
    // the watch/help thresholds marked — so "everyone's piled up at 25 min"
    // reads as a shape, not a number you compute by scanning cards.
    function sparkline(students) {
      if (!students.length) return '';
      const W = 232, H = 22, padX = 4;
      const max = Math.max(HELP_SECS, ...students.map(s => s.secondsOnExercise || 0));
      const x = secs => padX + (W - 2 * padX) * Math.min(secs, max) / max;
      // Severity is ordinal (ok < watch < help), so encode it TWICE: by hue and
      // by mark size. Red↔amber are indistinguishable under deuteranopia, so the
      // size ramp is what carries the distinction when colour can't — and it
      // reads in greyscale/print too. A surface-coloured ring separates dots
      // that pile up at the same time.
      const sev = s => s.struggle === 'help' ? 2 : s.struggle === 'watch' ? 1 : 0;
      const R = [2.8, 3.6, 4.4], COLOR = ['var(--green)', 'var(--amber)', 'var(--red)'];
      const thr = [WATCH_SECS, HELP_SECS]
        .map(t => `<line class="thr" x1="${x(t).toFixed(1)}" y1="1" x2="${x(t).toFixed(1)}" y2="${H - 1}"/>`)
        .join('');
      // Draw calm dots first so the ones that need attention sit on top.
      const dots = students.slice().sort((a, b) => sev(a) - sev(b))
        .map(s => { const k = sev(s);
          return `<circle cx="${x(s.secondsOnExercise || 0).toFixed(1)}" cy="${H / 2}" r="${R[k]}" fill="${COLOR[k]}" fill-opacity="0.9" stroke="var(--surface)" stroke-width="1"/>`; })
        .join('');
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Time-on-exercise distribution across the group; larger dots are students who need attention">${thr}${dots}</svg>`;
    }

    function summaryHtml(st) {
      if (!st || st.total === 0) return '<span class="muted">no activity yet</span>';
      const help = st.needHelp ? ` · <span class="warn">${st.needHelp} need help</span>` : '';
      return `${st.active} active${help} · med ${fmtDuration(st.medianSeconds)}`;
    }

    function createColumn() {
      const col = document.createElement('div');
      col.className = 'column';
      col.innerHTML = `<h2><span class="col-title"></span><span class="count"></span></h2>
        <div class="summary"></div>
        <div class="cards"></div>`;
      return col;
    }
    function updateColumn(col, c) {
      const g = c.g;
      const isEx = c.kind === 'ex';
      col.classList.toggle('unassigned', !isEx);
      const title = g.title || g.exercise || 'No exercise';
      col.querySelector('.col-title').innerHTML = (isEx ? ICONS.book : '') + `<span>${esc(title)}</span>`;
      const st = isEx ? (g.stats || { total: g.students.length, active: 0, needHelp: 0, medianSeconds: 0 }) : null;
      col.querySelector('.count').textContent = isEx ? st.total : g.students.length;
      const summary = col.querySelector('.summary');
      if (isEx) {
        summary.style.display = '';
        summary.innerHTML = summaryHtml(st) + sparkline(g.students);
      } else {
        summary.style.display = 'none';
        summary.innerHTML = '';
      }
      reconcile(col.querySelector('.cards'), g.students, s => s.student, createCard, updateCard);
    }

    let lastAudience = 0;

    function setAlert(n) {
      const a = document.getElementById('alert');
      a.innerHTML = n ? `<span class="alert-dot"></span>${n} need help` : '';
    }

    let lastOverview = null;

    function renderView(data) {
      lastOverview = data;
      const board = document.getElementById('board');
      const allStudents = data.exercises.flatMap(g => g.students).concat(data.noExercise);
      lastAudience = allStudents.length;
      setAlert(allStudents.filter(s => s.struggle === 'help').length);
      board.classList.toggle('tree', currentView === 'tree');

      if (data.exercises.length === 0 && data.noExercise.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = 'No exercises defined and no activity yet.<br>Define exercises and start the recorder + VSCode extension.';
        board.replaceChildren(empty);
        return;
      }
      if (currentView === 'tree') renderTree(board, data);
      else renderBoard(board, data);
    }

    // ---- tree view ----
    // The repo's real folders, fetched once per course. The tree is drawn from
    // these rather than from the course's exercises: exercises are only the
    // subset someone defined, and are themselves often derived from the repo's
    // .hermione.json. Refresh runs every 3s, so this must never be part of it.
    let repoDirs = { course: null, dirs: [], loading: false };
    async function loadRepoDirs(slug) {
      if (!slug || repoDirs.course === slug || repoDirs.loading) return;
      repoDirs.loading = true;
      try {
        const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/tree`);
        const body = res.ok ? await res.json() : { dirs: [] };
        repoDirs = { course: slug, dirs: body.dirs || [], loading: false };
      } catch (_) {
        // A failed fetch must not blank the tree — fall back to open paths.
        repoDirs = { course: slug, dirs: [], loading: false };
      }
      if (currentView === 'tree' && lastOverview) renderView(lastOverview);
    }

    // Only the paths someone actually has open, so the tree is the class's
    // attention rather than a directory listing. Same shape as `tree`: one
    // entry per line, directories before files, connectors on the left.
    function buildTree(students, dirs = []) {
      const root = { dirs: new Map(), files: new Map() };
      const descend = (parts) => {
        let node = root;
        for (const dir of parts) {
          if (!node.dirs.has(dir)) node.dirs.set(dir, { dirs: new Map(), files: new Map() });
          node = node.dirs.get(dir);
        }
        return node;
      };
      // Real folders first, so the structure is the repo's and stays put as
      // students move around inside it.
      for (const d of dirs) descend(String(d).split('/').filter(Boolean));
      for (const s of students) {
        const path = String(s.file || '').replace(/^\/+/, '');
        if (!path) continue; // nothing open — nothing to place in the tree
        const parts = path.split('/').filter(p => p && p !== '.');
        if (!parts.length) continue;
        const file = parts.pop();
        const node = descend(parts);
        if (!node.files.has(file)) node.files.set(file, []);
        node.files.get(file).push(s);
      }
      return root;
    }

    function treeRows(root) {
      const rows = [];
      const byName = (a, b) => a[0].localeCompare(b[0]);
      // `open` tracks, per ancestor level, whether that branch still has
      // siblings below it — that is what decides between "│" and blank.
      (function walk(node, prefix, open) {
        const entries = [
          ...[...node.dirs.entries()].sort(byName).map(([name, v]) => ({ name, v, dir: true })),
          ...[...node.files.entries()].sort(byName).map(([name, v]) => ({ name, v, dir: false })),
        ];
        entries.forEach((e, i) => {
          const last = i === entries.length - 1;
          const branch = open.map(o => (o ? '\u2502\u00a0\u00a0 ' : '\u00a0\u00a0\u00a0 ')).join('')
            + (last ? '\u2514\u2500\u2500 ' : '\u251c\u2500\u2500 ');
          const full = prefix + '/' + e.name;
          rows.push({ key: full, branch, name: e.name, dir: e.dir, people: e.dir ? [] : e.v });
          if (e.dir) walk(e.v, full, open.concat(!last));
        });
      })(root, '', []);
      return rows;
    }

    function createTreeRow() {
      const el = document.createElement('div');
      el.className = 'trow';
      el.innerHTML = '<code class="tpath"><span class="branch"></span><span class="tname"></span></code><div class="tpeople"></div>';
      return el;
    }

    function updateTreeRow(el, row) {
      const path = el.querySelector('.tpath');
      el.classList.toggle('root', !!row.root);
      path.classList.toggle('dir', row.dir);
      path.querySelector('.branch').textContent = row.branch;
      path.querySelector('.tname').textContent = (row.dir && !row.root) ? row.name + '/' : row.name;
      const host = el.querySelector('.tpeople');
      reconcile(host, row.people, s => s.student, () => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tperson';
        return b;
      }, (b, s) => {
        b.className = 'tperson' + (s.struggle === 'help' ? ' help' : s.struggle === 'watch' ? ' watch' : '');
        b.title = `${s.student} — open terminal`;
        b.innerHTML = `${avatarHtml(s.student, s.status)}<span class="pname">${esc(s.student)}</span>`
          + (s.struggle === 'help' ? '<span class="pill help">needs help</span>'
            : s.struggle === 'watch' ? '<span class="pill watch">watch</span>' : '');
        b.onclick = () => openTerminal(s.student, s.terminalSessionId, s.exercise);
      });
    }

    function renderTree(board, data) {
      const students = data.exercises.flatMap(g => g.students).concat(data.noExercise);
      // Top-level repo folders only. Deeper ones arrive from the paths students
      // actually have open, so a repo's theme and build internals — seven of
      // the seventeen directories in one real course — don't bury the
      // exercises on a board being scanned mid-class.
      const dirs = (repoDirs.course === currentCourse ? repoDirs.dirs : [])
        .filter(d => !String(d).includes('/'));
      const root = buildTree(students, dirs);
      const rows = treeRows(root);
      if (rows.length) {
        const c = courseList.find(c => c.slug === currentCourse);
        rows.unshift({ key: '__root__', branch: '', name: (c && c.repoUrl) ? repoLabel(c.repoUrl) : '.', dir: true, root: true, people: [] });
      }
      if (!rows.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = repoDirs.course === currentCourse
          ? 'Nobody has a file open, and the linked repository has no folders to show.'
          : 'Link a repository to this course to see its structure.';
        board.replaceChildren(empty);
        return;
      }
      reconcile(board, rows, r => r.key, createTreeRow, updateTreeRow);
    }

    function renderBoard(board, data) {
      const cols = data.exercises.map(g => ({ key: 'ex:' + g.exercise, kind: 'ex', g }));
      if (data.noExercise.length) {
        cols.push({ key: '__none__', kind: 'none', g: { title: 'No exercise', students: data.noExercise } });
      }
      reconcile(board, cols, c => c.key, createColumn, updateColumn);
    }

    let currentCourse = null;
    let courseList = []; // last-fetched active courses (slug, name, repoUrl, archived)

    async function fetchCourses() {
      const res = await fetch('/api/courses');
      if (res.status === 401) { window.location.href = '/login'; return null; }
      return res.json();
    }

    // A repo URL shown as a compact "owner/name" chip; falls back to the host path.
    function repoLabel(url) {
      try {
        const u = new URL(url);
        return u.pathname.replace(/^\/+|\/+$|\.git$/g, '') || u.host;
      } catch (_) {
        const m = url.match(/[:/]([^/:]+\/[^/]+?)(?:\.git)?\/?$/);
        return m ? m[1] : url;
      }
    }

    // Only http(s) URLs are safe as an href — a stored `javascript:`/`data:`
    // repoUrl must never become a clickable link in another teacher's session.
    function safeHttpUrl(url) {
      try {
        const u = new URL(url);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
      } catch (_) { return null; }
    }

    function updateCourseRepo() {
      const c = courseList.find(c => c.slug === currentCourse);
      const link = document.getElementById('course-repo');
      // Toggle style.display, not [hidden]: the .course-repo rule sets
      // display:inline-flex, which would override the hidden attribute.
      if (!c || !c.repoUrl) { link.style.display = 'none'; return; }
      document.getElementById('course-repo-name').textContent = repoLabel(c.repoUrl);
      const href = safeHttpUrl(c.repoUrl);
      if (href) {
        link.href = href;
        link.classList.remove('unlinked');
      } else {
        // Non-http(s) (e.g. an ssh git URL) — show the label, but not clickable.
        link.removeAttribute('href');
        link.classList.add('unlinked');
      }
      link.style.display = '';
    }

    function populateCourses(courses, selectSlug) {
      courseList = courses;
      const sel = document.getElementById('course');
      sel.innerHTML = courses.map(c => `<option value="${esc(c.slug)}"${c.description ? ` title="${esc(c.description)}"` : ''}>${esc(c.name)}</option>`).join('');
      const preferred = selectSlug || rememberedCourse();
      const want = (preferred && courses.some(c => c.slug === preferred))
        ? preferred : (courses[0]?.slug || null);
      if (want) sel.value = want;
      rememberCourse(want);
      document.getElementById('course-settings').disabled = !want;
      document.getElementById('course').style.display = courses.length ? '' : 'none';
      updateCourseRepo();
      if (!courses.length) showNoCourses();
    }

    // First-run: a teacher with no courses yet. Prompt them to create one rather
    // than leaving the board on a perpetual "Loading…".
    function showNoCourses() {
      const board = document.getElementById('board');
      const el = document.createElement('div');
      el.className = 'empty first-run';
      el.innerHTML = `<h2>No courses yet</h2>
        <p>Create a course — or link an existing git repo as one — to start watching students.</p>
        <button class="btn primary" id="fr-create" type="button">Create your first course</button>`;
      board.replaceChildren(el);
      board.querySelector('#fr-create').addEventListener('click', openNewCourse);
    }

    async function loadCourses() {
      let courses;
      try { courses = await fetchCourses(); } catch (_) { return; }
      if (!courses) return;
      populateCourses(courses);
      document.getElementById('course').addEventListener('change', () => {
        rememberCourse(document.getElementById('course').value);
        updateCourseRepo();
        [...openPanes.keys()].forEach(closeTerminal); // terminals belong to a course
        connectMessages();
        refresh();
      });
      connectMessages();
    }

    // After creating/archiving a course, refresh the switcher and jump to a course.
    async function reloadCourses(selectSlug) {
      let courses;
      try { courses = await fetchCourses(); } catch (_) { return; }
      if (!courses) return;
      populateCourses(courses, selectSlug);
      [...openPanes.keys()].forEach(closeTerminal);
      connectMessages();
      refresh();
    }

    // ---- live messages (WebSocket) ----
    let msgSocket = null;
    function connectMessages() {
      if (msgSocket) { try { msgSocket.close(); } catch (_) {} msgSocket = null; }
      if (!currentCourse) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws?course=${encodeURIComponent(currentCourse)}`);
      msgSocket = ws;
      ws.onmessage = (ev) => {
        try { const m = JSON.parse(ev.data); if (m && m.body) toast(m.body); } catch (_) {}
      };
      ws.onclose = () => { if (msgSocket === ws) { msgSocket = null; setTimeout(connectMessages, 5000); } };
    }
    function toast(text) {
      const c = document.getElementById('toasts');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = text;
      c.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 5000);
    }

    // ---- freshness ----
    let lastUpdated = 0, lastError = false;
    function setFreshness() {
      const el = document.getElementById('freshness');
      if (lastError) {
        el.className = 'freshness failed';
        el.innerHTML = '<span class="fdot"></span>Update failed — retrying';
        return;
      }
      if (!lastUpdated) { el.className = 'freshness'; el.textContent = 'Connecting…'; return; }
      const s = Math.round((Date.now() - lastUpdated) / 1000);
      el.className = 'freshness' + (s > 15 ? ' stale' : '');
      el.innerHTML = `<span class="fdot"></span>Updated ${s}s ago`;
    }
    setInterval(setFreshness, 1000);

    async function refresh() {
      if (!currentCourse) return;
      let data;
      try {
        const res = await fetch(`/api/overview?course=${encodeURIComponent(currentCourse)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) throw new Error('http ' + res.status);
        data = await res.json();
      } catch (_) { lastError = true; setFreshness(); return; }
      lastError = false; lastUpdated = Date.now(); setFreshness();
      renderView(data);
      loadRepoDirs(currentCourse);
    }

    // ---- terminal panes ----
    function openTerminal(student, sessionId, exercise) {
      if (!student) return;
      if (openPanes.has(student)) { flashPane(student); return; }
      if (!localStorage.getItem(HINT_KEY)) {
        localStorage.setItem(HINT_KEY, '1');
        document.getElementById('hint').style.display = 'none';
      }

      const dock = document.getElementById('dock');
      const pane = document.createElement('div');
      pane.className = 'pane';
      pane.innerHTML = `
        <div class="pane-head">
          ${avatarHtml(student, 'active')}
          <span><b>${esc(student)}</b> ${exercise ? `<span class="ex">· ${esc(exercise)}</span>` : ''}</span>
          <button class="close" type="button" title="Close" aria-label="Close ${esc(student)}'s terminal">${ICONS.close}</button>
        </div>
        <div class="term"></div>`;
      dock.appendChild(pane);
      dock.classList.add('active');
      document.getElementById('divider').classList.add('active');
      pane.querySelector('.close').addEventListener('click', () => closeTerminal(student));

      const body = pane.querySelector('.term');
      let term = null, fit = null, es = null;

      if (!sessionId) {
        body.innerHTML = `<div class="note">No terminal session recorded for <b>${esc(student)}</b> yet.</div>`;
      } else {
        term = new Terminal({ fontFamily: 'ui-monospace, monospace', fontSize: 12,
          scrollback: 10000, theme: termTheme(), convertEol: false });
        fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(body);
        setTimeout(() => { try { fit.fit(); } catch (_) {} }, 0);

        es = new EventSource(`/api/sessions/${sessionId}/stream?history=true`);
        es.onmessage = (e) => {
          const chunk = JSON.parse(e.data);
          if (chunk.stream === 'stdout') term.write(b64ToBytes(chunk.data));
        };
      }

      openPanes.set(student, { term, fit, es, el: pane });
      relayout();
      markOpenCards();
    }

    function closeTerminal(student) {
      const p = openPanes.get(student);
      if (!p) return;
      if (p.es) p.es.close();
      if (p.term) p.term.dispose();
      p.el.remove();
      openPanes.delete(student);
      if (openPanes.size === 0) {
        document.getElementById('dock').classList.remove('active');
        const div = document.getElementById('divider');
        div.classList.remove('active');
        // Hand the space back to the board and clear any dragged sizing.
        document.getElementById('board').style.flex = '';
        document.getElementById('dock').style.flex = '';
      }
      relayout();
      markOpenCards();
    }

    function flashPane(student) {
      const p = openPanes.get(student);
      if (!p) return;
      p.el.style.outline = '2px solid var(--accent)';
      setTimeout(() => { p.el.style.outline = ''; }, 600);
    }

    function markOpenCards() {
      document.querySelectorAll('.card').forEach(el => {
        el.classList.toggle('open', openPanes.has(el.dataset.student));
      });
    }

    // Lay terminal panes out in a near-square grid and refit.
    function relayout() {
      const dock = document.getElementById('dock');
      const n = openPanes.size;
      const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
      dock.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      setTimeout(() => openPanes.forEach(p => { try { p.fit && p.fit.fit(); } catch (_) {} }), 30);
    }

    function refitPanes() { openPanes.forEach(p => { try { p.fit && p.fit.fit(); } catch (_) {} }); }
    window.addEventListener('resize', refitPanes);

    // ---- draggable board/dock divider ----
    (function () {
      const divider = document.getElementById('divider');
      let dragging = false;
      divider.addEventListener('pointerdown', (e) => {
        dragging = true; divider.classList.add('dragging');
        divider.setPointerCapture(e.pointerId); e.preventDefault();
      });
      divider.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const content = document.getElementById('content');
        const rect = content.getBoundingClientRect();
        const min = 240, max = rect.width - 280;
        const bx = Math.max(min, Math.min(max, e.clientX - rect.left));
        document.getElementById('board').style.flex = `0 0 ${bx}px`;
        document.getElementById('dock').style.flex = '1 1 0';
        refitPanes();
      });
      const end = (e) => {
        if (!dragging) return;
        dragging = false; divider.classList.remove('dragging');
        try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      divider.addEventListener('pointerup', end);
      divider.addEventListener('pointercancel', end);
    })();

    // ---- broadcast composer ----
    function openBroadcast() {
      if (!currentCourse) return;
      const opener = document.activeElement;
      const courseName = document.querySelector('#course option:checked')?.textContent || currentCourse;
      const max = 280;

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bc-title">
          <h2 id="bc-title">Broadcast message</h2>
          <p class="sub">To ${lastAudience} student${lastAudience === 1 ? '' : 's'} in ${esc(courseName)}</p>
          <textarea id="bc-text" maxlength="${max}" placeholder="Message to the class…" aria-label="Message to the class"></textarea>
          <div class="row">
            <span class="ct" id="bc-ct">0 / ${max}</span>
            <button class="btn" id="bc-cancel" type="button">Cancel</button>
            <button class="btn primary" id="bc-send" type="button" disabled>Send</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);

      const ta = backdrop.querySelector('#bc-text');
      const ct = backdrop.querySelector('#bc-ct');
      const send = backdrop.querySelector('#bc-send');
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };

      ta.focus();
      ta.addEventListener('input', () => {
        ct.textContent = `${ta.value.length} / ${max}`;
        send.disabled = ta.value.trim().length === 0;
      });
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#bc-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { close(); return; }
        if (e.key === 'Tab') { // simple focus trap
          const f = [...backdrop.querySelectorAll('textarea,button')].filter(x => !x.disabled);
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
      send.addEventListener('click', async () => {
        const text = ta.value.trim();
        if (!text) return;
        send.disabled = true; send.textContent = 'Sending…';
        try {
          const res = await fetch('/api/messages', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ course: currentCourse, text }),
          });
          if (res.ok) { close(); toast('Broadcast sent to the class'); }
          else { send.disabled = false; send.textContent = 'Send'; toast('Failed to send broadcast'); }
        } catch (_) { send.disabled = false; send.textContent = 'Send'; toast('Failed to send broadcast'); }
      });
    }

    // ---- create / link a course ----
    function openNewCourse() {
      const opener = document.activeElement;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nc-title">
          <h2 id="nc-title">New course</h2>
          <p class="sub">Create a course, or link an existing git repo as one.</p>
          <div class="field">
            <label for="nc-name">Name</label>
            <input type="text" id="nc-name" placeholder="Intro to Python" />
          </div>
          <div class="field">
            <label for="nc-repo">Repository <span class="desc">— optional; links a repo to this course</span></label>
            <input type="text" id="nc-repo" placeholder="https://github.com/org/intro-python" />
          </div>
          <div class="field">
            <label for="nc-slug">Slug <span class="desc">— optional; derived from the name or repo</span></label>
            <input type="text" id="nc-slug" placeholder="intro-python" />
          </div>
          <div class="field">
            <label class="toggle"><input type="checkbox" id="nc-seed" checked /> Seed exercises from the repo's folders <span class="desc">(GitHub)</span></label>
          </div>
          <div class="row">
            <span class="ct" id="nc-msg"></span>
            <button class="btn" id="nc-cancel" type="button">Cancel</button>
            <button class="btn primary" id="nc-create" type="button">Create</button>
          </div>
          <div id="nc-archived"></div>
        </div>`;
      document.body.appendChild(backdrop);

      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#nc-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      const name = backdrop.querySelector('#nc-name');
      name.focus();
      renderArchivedCourses(backdrop.querySelector('#nc-archived'));

      const create = backdrop.querySelector('#nc-create');
      const msg = backdrop.querySelector('#nc-msg');
      create.addEventListener('click', async () => {
        const payload = {
          name: name.value.trim(),
          slug: backdrop.querySelector('#nc-slug').value.trim(),
          repoUrl: backdrop.querySelector('#nc-repo').value.trim(),
          seedExercises: backdrop.querySelector('#nc-seed').checked,
        };
        if (!payload.name && !payload.slug && !payload.repoUrl) {
          msg.textContent = 'Enter a name, slug, or repo'; return;
        }
        msg.textContent = ''; create.disabled = true; create.textContent = 'Creating…';
        try {
          const res = await fetch('/api/courses', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (res.ok) {
            const c = await res.json();
            await reloadCourses(c.slug);
            close();
            const seeded = c.exercisesSeeded ? ` · ${c.exercisesSeeded} exercise${c.exercisesSeeded === 1 ? '' : 's'} seeded` : '';
            toast(`Course “${c.name}” created${seeded}`);
            if (c.seedNote) toast(`Exercises not seeded: ${c.seedNote}`);
            showEnrollmentToken(c);
          } else {
            const t = await res.text();
            create.disabled = false; create.textContent = 'Create';
            msg.textContent = t || 'Failed to create course';
          }
        } catch (_) {
          create.disabled = false; create.textContent = 'Create';
          msg.textContent = 'Failed to create course';
        }
      });
    }

    // Lists archived courses (if any) with one-click restore, inside the New
    // course modal — the natural place to manage the course catalog.
    async function renderArchivedCourses(host) {
      let archived;
      try {
        const res = await fetch('/api/courses?archived=1');
        if (!res.ok) return;
        archived = await res.json();
      } catch (_) { return; }
      if (!archived.length) return;
      host.innerHTML = `<hr><div class="field"><label>Archived courses</label>
        <ul class="archived-list">${archived.map(c =>
          `<li><span class="who">${esc(c.name)}</span><button class="btn" data-slug="${esc(c.slug)}" type="button">Restore</button></li>`
        ).join('')}</ul></div>`;
      host.querySelectorAll('button[data-slug]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true; btn.textContent = 'Restoring…';
          const ok = await patchCourse(btn.dataset.slug, { archived: false });
          if (ok) { btn.closest('li').remove(); await reloadCourses(btn.dataset.slug); toast('Course restored'); }
          else { btn.disabled = false; btn.textContent = 'Restore'; toast('Failed to restore'); }
        });
      });
    }

    // Shared PATCH /api/courses/{slug}. Returns true on success.
    async function patchCourse(slug, body) {
      try {
        const res = await fetch(`/api/courses/${encodeURIComponent(slug)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        return res.ok;
      } catch (_) { return false; }
    }

    // A course is only useful once students can enroll into it, so surface the

        catch (_) { field.select(); backdrop.querySelector('#et-msg').textContent = 'Press ⌘/Ctrl+C'; }
