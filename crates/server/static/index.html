            <input type="text" id="cs-token" class="mono" readonly value="${esc(c.enrollmentToken || '')}" />
            <div class="add-member">
              <button class="btn" id="cs-copy" type="button">Copy</button>
              <button class="btn" id="cs-rotate" type="button">Rotate…</button>
              <span class="ct" id="cs-token-msg"></span>
            </div>
          </div>
          <div class="field">
            <label>Teachers</label>
            <ul class="members" id="cs-members"></ul>
            <div class="add-member">
              <input type="text" id="cs-add" placeholder="username to add" />
              <button class="btn" id="cs-add-btn" type="button">Add</button>
            </div>
            <span class="ct" id="cs-member-msg"></span>
          </div>
          <div class="field">
            <label>Exercises</label>
            <button class="btn" id="cs-exercises" type="button">Edit exercises…</button>
          </div>
          <hr>
          <div class="row">
            <button class="btn danger" id="cs-archive" type="button">Archive course</button>
            <span class="ct" id="cs-msg"></span>
            <button class="btn" id="cs-cancel" type="button">Close</button>
            <button class="btn primary" id="cs-save" type="button">Save</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#cs-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      backdrop.querySelector('#cs-name').focus();

      // Members list, re-rendered after add/remove.
      let members = c.members || [];
      const memberMsg = backdrop.querySelector('#cs-member-msg');
      function renderMembers() {
        const ul = backdrop.querySelector('#cs-members');
        ul.innerHTML = members.map(u =>
          `<li><span class="who">${esc(u)}</span><button data-user="${esc(u)}" type="button" title="Remove ${esc(u)}" aria-label="Remove ${esc(u)}">✕</button></li>`
        ).join('');
        ul.querySelectorAll('button[data-user]').forEach(btn => btn.addEventListener('click', async () => {
          const user = btn.dataset.user;
          if (members.length <= 1) { memberMsg.textContent = "Can't remove the last teacher"; return; }
          btn.disabled = true;
          try {
            const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/members/${encodeURIComponent(user)}`, { method: 'DELETE' });
            if (res.ok) { members = members.filter(m => m !== user); renderMembers(); memberMsg.textContent = ''; }
            else { btn.disabled = false; memberMsg.textContent = (await res.text()) || 'Failed to remove'; }
          } catch (_) { btn.disabled = false; memberMsg.textContent = 'Failed to remove'; }
        }));
      }
      renderMembers();

      backdrop.querySelector('#cs-add-btn').addEventListener('click', async () => {
        const input = backdrop.querySelector('#cs-add');
        const username = input.value.trim();
        if (!username) return;
        memberMsg.textContent = '';
        try {
          const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/members`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username }),
          });
          if (res.ok) { if (!members.includes(username)) members.push(username); members.sort(); renderMembers(); input.value = ''; }
          else { memberMsg.textContent = (await res.text()) || 'Failed to add'; }
        } catch (_) { memberMsg.textContent = 'Failed to add'; }
      });

      const tokenField = backdrop.querySelector('#cs-token');
      backdrop.querySelector('#cs-copy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(tokenField.value); backdrop.querySelector('#cs-token-msg').textContent = 'Copied'; }
        catch (_) { tokenField.select(); backdrop.querySelector('#cs-token-msg').textContent = 'Press ⌘/Ctrl+C'; }
      });
      backdrop.querySelector('#cs-rotate').addEventListener('click', async () => {
        if (!confirm('Rotate the enrollment token? Students using the old token will need the new one.')) return;
        try {
          const res = await fetch(`/api/courses/${encodeURIComponent(slug)}/rotate-token`, { method: 'POST' });
          if (res.ok) { const j = await res.json(); tokenField.value = j.enrollmentToken; backdrop.querySelector('#cs-token-msg').textContent = 'Rotated'; }
          else { backdrop.querySelector('#cs-token-msg').textContent = 'Failed to rotate'; }
        } catch (_) { backdrop.querySelector('#cs-token-msg').textContent = 'Failed to rotate'; }
      });

      backdrop.querySelector('#cs-exercises').addEventListener('click', () => openExercisesEditor(slug, c.name));

      backdrop.querySelector('#cs-archive').addEventListener('click', async () => {
        if (!confirm(`Archive “${c.name}”? It keeps all its data but drops out of the switcher. You can restore it from New course.`)) return;
        const ok = await patchCourse(slug, { archived: true });
        if (ok) { close(); await reloadCourses(null); toast('Course archived'); }
        else { toast('Failed to archive'); }
      });

      const save = backdrop.querySelector('#cs-save');
      save.addEventListener('click', async () => {
        save.disabled = true; save.textContent = 'Saving…';
        const ok = await patchCourse(slug, {
          name: backdrop.querySelector('#cs-name').value.trim(),
          repoUrl: backdrop.querySelector('#cs-repo').value.trim(),
          description: backdrop.querySelector('#cs-description').value.trim(),
          term: backdrop.querySelector('#cs-term').value.trim(),
          institution: backdrop.querySelector('#cs-institution').value.trim(),
          level: backdrop.querySelector('#cs-level').value.trim(),
        });
        if (ok) { close(); await reloadCourses(slug); toast('Course settings saved'); }
        else { save.disabled = false; save.textContent = 'Save'; backdrop.querySelector('#cs-msg').textContent = 'Failed to save'; }
      });
    }

    // ---- exercises editor ----
    // Exercises are edited as plain lines "slug: Title" (one per line); line order
    // is the display order. Saving replaces the course's exercise list exactly.
    function parseExerciseLines(text) {
      return text.split('\n').map(l => l.trim()).filter(Boolean).map((line, i) => {
        const idx = line.indexOf(':');
        const slug = (idx < 0 ? line : line.slice(0, idx)).trim();
        const title = idx < 0 ? '' : line.slice(idx + 1).trim();
        return { slug, title: title || slug, position: i };
      }).filter(e => e.slug);
    }
    function exercisesToLines(list) {
      return (list || []).map(e => e.title && e.title !== e.slug ? `${e.slug}: ${e.title}` : e.slug).join('\n');
    }

    async function openExercisesEditor(slug, courseName) {
      let list;
      try {
        const res = await fetch(`/api/exercises?course=${encodeURIComponent(slug)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (!res.ok) { toast('Failed to load exercises'); return; }
        list = await res.json();
      } catch (_) { toast('Failed to load exercises'); return; }

      const opener = document.activeElement;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ex-title">
          <h2 id="ex-title">Exercises</h2>
          <p class="sub">For ${esc(courseName || slug)} — one per line, in order. Matches the names in the repo's <code>.hermione.json</code>.</p>
          <div class="field">
            <label for="ex-text">Exercises <span class="desc">— slug: Title (title optional)</span></label>
            <textarea id="ex-text" class="mono" placeholder="ex1: Pointers &amp; memory&#10;ex2: Strings">${esc(exercisesToLines(list))}</textarea>
          </div>
          <div class="row">
            <span class="ct" id="ex-msg"></span>
            <button class="btn" id="ex-cancel" type="button">Cancel</button>
            <button class="btn primary" id="ex-save" type="button">Save</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#ex-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      const ta = backdrop.querySelector('#ex-text');
      ta.focus();

      const save = backdrop.querySelector('#ex-save');
      save.addEventListener('click', async () => {
        save.disabled = true; save.textContent = 'Saving…';
        const exercises = parseExerciseLines(ta.value);
        try {
          const res = await fetch('/api/exercises', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ course: slug, exercises, replace: true }),
          });
          if (res.ok) {
            close();
            toast(`Exercises saved (${exercises.length})`);
            if (slug === currentCourse) refresh();
          } else {
            const t = await res.text();
            save.disabled = false; save.textContent = 'Save';
            backdrop.querySelector('#ex-msg').textContent = t || 'Failed to save';
          }
        } catch (_) {
          save.disabled = false; save.textContent = 'Save';
          backdrop.querySelector('#ex-msg').textContent = 'Failed to save';
        }
      });
    }

    // ---- AI assistant settings ----
    // Skills/MCP are edited as plain lines and parsed to the API's shapes.
    function parseSkills(text) {
      return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
        const [kind, skillId, version] = line.split(':').map(p => p.trim());
        const o = { type: kind || 'anthropic', skillId: skillId || '' };
        if (version) o.version = version;
        return o;
      }).filter(s => s.skillId);
    }
    function skillsToText(skills) {
      return (skills || []).map(s => [s.type, s.skillId, s.version].filter(Boolean).join(':')).join('\n');
    }
    function parseMcp(text) {
      return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
        const i = line.indexOf(' ');
        return i < 0 ? null : { name: line.slice(0, i).trim(), url: line.slice(i + 1).trim() };
      }).filter(Boolean);
    }
    function mcpToText(servers) {
      return (servers || []).map(s => `${s.name} ${s.url}`).join('\n');
    }

    async function openAssistantSettings() {
      if (!currentCourse) return;
      let cfg;
      try {
        const res = await fetch(`/api/assistant?course=${encodeURIComponent(currentCourse)}`);
        if (res.status === 401) { window.location.href = '/login'; return; }
        cfg = await res.json();
      } catch (_) { toast('Failed to load assistant settings'); return; }

      const opener = document.activeElement;
      const courseName = document.querySelector('#course option:checked')?.textContent || currentCourse;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="as-title">
          <h2 id="as-title">AI assistant</h2>
          <p class="sub">For ${esc(courseName)}</p>
          ${cfg.available ? '' : '<div class="notice warn">No Anthropic API key is configured on the server, so the assistant cannot be enabled. Set HERMIONE_ANTHROPIC_API_KEY.</div>'}
          <div class="field">
            <label class="toggle"><input type="checkbox" id="as-enabled" ${cfg.enabled ? 'checked' : ''} ${cfg.available ? '' : 'disabled'} /> Enable the assistant for this course</label>
          </div>
          <div class="field">
            <label for="as-model">Model</label>
            <input type="text" id="as-model" value="${esc(cfg.model || '')}" />
          </div>
          <div class="field">
            <label for="as-system">System prompt <span class="desc">— how it should help (tone, how much to reveal)</span></label>
            <textarea id="as-system" placeholder="You are a patient teaching assistant. Guide students with hints; don't hand over full solutions.">${esc(cfg.systemPrompt || '')}</textarea>
          </div>
          <div class="field">
            <label for="as-skills">Skills <span class="desc">— one per line: type:skill_id[:version], e.g. anthropic:pdf</span></label>
            <textarea id="as-skills" class="mono" placeholder="anthropic:pdf">${esc(skillsToText(cfg.skills))}</textarea>
          </div>
          <div class="field">
            <label for="as-mcp">MCP servers <span class="desc">— one per line: name url (public servers only)</span></label>
            <textarea id="as-mcp" class="mono" placeholder="docs https://mcp.example.com/sse">${esc(mcpToText(cfg.mcpServers))}</textarea>
          </div>
          <div class="row">
            <span class="ct">${cfg.configured ? 'Agent synced' : 'Not synced yet'}</span>
            <button class="btn" id="as-cancel" type="button">Cancel</button>
            <button class="btn primary" id="as-save" type="button">Save</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => { backdrop.remove(); if (opener && opener.focus) opener.focus(); };
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('#as-cancel').addEventListener('click', close);
      backdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      backdrop.querySelector('#as-system').focus();

      const save = backdrop.querySelector('#as-save');
      save.addEventListener('click', async () => {
        const payload = {
          course: currentCourse,
          enabled: backdrop.querySelector('#as-enabled').checked,
          model: backdrop.querySelector('#as-model').value.trim(),
          systemPrompt: backdrop.querySelector('#as-system').value,
          skills: parseSkills(backdrop.querySelector('#as-skills').value),
          mcpServers: parseMcp(backdrop.querySelector('#as-mcp').value),
        };
        save.disabled = true; save.textContent = 'Saving…';
        try {
          const res = await fetch('/api/assistant', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (res.ok) { close(); toast('Assistant settings saved'); }
          else { const t = await res.text(); save.disabled = false; save.textContent = 'Save'; toast(t || 'Failed to save'); }
        } catch (_) { save.disabled = false; save.textContent = 'Save'; toast('Failed to save'); }
      });
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });
    document.getElementById('broadcast').addEventListener('click', openBroadcast);
    document.getElementById('new-course').addEventListener('click', openNewCourse);
    document.getElementById('course-settings').addEventListener('click', openCourseSettings);
    document.getElementById('assistant-settings').addEventListener('click', openAssistantSettings);
    document.getElementById('theme-toggle').addEventListener('click', () =>
      setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark'));
    applyTheme(); // paint the correct toggle icon for the resolved theme

    (async () => {
      if (localStorage.getItem(HINT_KEY)) document.getElementById('hint').style.display = 'none';
      setFreshness();
      await loadCourses();
      let storedView = null;
      try { storedView = localStorage.getItem(VIEW_KEY); } catch (_) {}
      currentView = storedView === 'tree' ? 'tree' : 'board';
      for (const b of document.querySelectorAll('#view-toggle button')) {
        b.setAttribute('aria-pressed', String(b.dataset.view === currentView));
        b.addEventListener('click', () => setView(b.dataset.view));
      }

      await refresh();
      setInterval(refresh, 3000);
    })();
  </script>
</body>
</html>
