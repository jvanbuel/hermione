<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermione — Class Overview</title>
  <!-- Apply the saved theme before first paint so the page never flashes the
       wrong colours. No saved choice → falls through to prefers-color-scheme. -->
  <script>
    try {
      var t = localStorage.getItem('hermione.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/hermione-mark.svg" />
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/assets/chrome.css" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <style>
    body {
      display: flex; flex-direction: column;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base); line-height: 1.4;
      font-variant-numeric: tabular-nums;
      background: var(--bg); color: var(--fg);
    }

    /* Segmented Board/Tree switch — one control, two states. */
    #view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    #view-toggle button {
      display: inline-flex; align-items: center; gap: 5px; border: 0; border-radius: 0;
      background: none; color: var(--fg-muted); font: inherit; font-size: var(--fs-sm);
      padding: 5px 9px; cursor: pointer;
    }
    #view-toggle button + button { border-left: 1px solid var(--border); }
    #view-toggle button:hover { background: var(--surface-2); }
    #view-toggle button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }

    .hint { font-size: var(--fs-sm); color: var(--fg-subtle); }
    .freshness {
      font-size: var(--fs-sm); color: var(--fg-subtle);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .freshness.stale { color: var(--amber); }
    .freshness.failed { color: var(--red-text); }
    .freshness .fdot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
    /* Header controls keep their size. Without this every item shrinks at once
     * and the header grows to two or three lines of squeezed text. */
    header button, header a.nav, #view-toggle, #alert, header select { flex: none; }
    header #alert:not(:empty) { white-space: nowrap; }
    /* In the status bar the hint is what gives way when the window is narrow. */
    #freshness { white-space: nowrap; }
    .hint { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Broadcast is the header's primary action — filled, so it leads the eye. */
    #broadcast { background: var(--green); border-color: transparent; color: #fff; font-weight: 600; }
    #broadcast:hover { background: var(--green-emphasis); }
    /* On a narrower window the bar gives up words before it gives up controls:
     * the actions keep their icons (and their names, for screen readers), then
     * the wordmark and repo name go. */
    @media (max-width: 1240px) {
      header .lbl {
        position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }
      header a.nav, #broadcast { padding: 5px; }
      header a.nav .ico, #broadcast .ico { width: 16px; height: 16px; }
    }
    @media (max-width: 960px) {
      header h1, .course-repo span { display: none; }
    }
    /* Only the course-settings gear stays beside the switcher. */
    #course-settings { padding: 5px; }
    #course-settings .ico { width: 15px; height: 15px; }
    /* Linked-repo chip next to the switcher. */
    .course-repo { font-size: var(--fs-sm); color: var(--fg-muted); text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px; max-width: 220px; }
    .course-repo:hover { color: var(--fg); text-decoration: underline; }
    .course-repo.unlinked { cursor: default; }
    .course-repo.unlinked:hover { color: var(--fg-muted); text-decoration: none; }
    .course-repo .ico { width: 14px; height: 14px; flex: none; }
    .course-repo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Members editor in the course-settings modal. */
    .members { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .members li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--bg); }
    .members li .who { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .members li .you { color: var(--fg-subtle); font-size: var(--fs-xs); }
    .members li button { background: none; border: none; color: var(--fg-subtle); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: var(--fs-base); }
    .members li button:hover { color: var(--red-text); background: var(--surface-2); }
    .modal .profile-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .modal .profile-grid > div > label { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: 4px; }
    .add-member { display: flex; gap: 8px; margin-top: 8px; }
    .add-member input { flex: 1 1 auto; }
    .modal .archived-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .modal .archived-list li { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); }
    .modal .archived-list li .who { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal .danger { color: var(--red-text); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
    .modal .danger:hover { background: var(--help-wash); }
    .modal hr { border: none; border-top: 1px solid var(--border-subtle); margin: 16px 0 4px; }
    /* The at-a-glance alarm: a real badge, not just red text. */
    #alert:not(:empty) { font-size: var(--fs-sm); color: var(--red-text); font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
      background: var(--help-wash); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent);
      border-radius: var(--radius-pill); }
    #alert .alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 70%, transparent); animation: alert-pulse 2s var(--ease) infinite; }
    @keyframes alert-pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 55%, transparent); }
      70% { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    #content { flex: 1 1 auto; display: flex; min-height: 0; }
    /* Quiet facts about the page itself — how fresh it is, what to click —
     * live under the work, not among the controls above it. */
    #statusbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 16px; min-height: 28px;
      padding: 3px 18px; border-top: 1px solid var(--border-subtle); background: var(--surface);
    }
    #statusbar .spacer { margin-left: auto; }

    /* ---- Overview board (main pane) ---- */
    #board {
      flex: 1 1 0; min-width: 0; overflow-x: auto;
      display: flex; gap: 16px; padding: 16px; align-items: flex-start;
    }
    /* ---- Tree view: the repo, pruned to what people actually have open ---- */
    /* The grid lives on the container, and each row is display:contents, so the
     * name column lines up across every row however deep the path goes. */
    /* ---- Tree view: the repo's folders, and who is in which file ----
     * One row per folder or file. A file's row carries the people in it, so the
     * question the view exists to answer — who is where? — is answered by
     * reading along a line, not by matching a name in one column to a group in
     * another. Structure is drawn with indent guides (a repeating background,
     * so they run unbroken down the rows) rather than typed out as box-drawing
     * characters, which broke between rows and were most of the visual noise. */
    #board.tree {
      /* `stretch`, not the board's usual flex-start: a row that shrank to its
       * content would make the name column's percentage width meaningless. */
      display: flex; flex-direction: column; align-items: stretch; align-content: start;
      /* The board spaces its exercise columns apart; rows here must touch, or the
       * indent guides break into a dash per row. */
      gap: 0;
      /* A column about as wide as the class needs, centred; on a small screen
       * it just takes the width. */
      padding: 24px max(24px, calc((100% - 1120px) / 2)) 48px;
      overflow: auto;
    }
    /* The rows together form one bordered panel: each draws its own sides and
     * the line under it, and the first and last round the corners. Ruled edges
     * are what tell a name from the people beside it, and one row from the
     * next; without them the same content read as scattered text. */
    #board.tree .trow {
      --indent: 22px;
      position: relative; flex: 0 0 auto;
      display: flex; align-items: stretch; gap: 0;
      padding: 0 0 0 10px;
      background: var(--surface);
      border: 1px solid var(--border); border-top: 0;
    }
    #board.tree .trow:first-child { border-top: 1px solid var(--border); border-radius: 10px 10px 0 0; }
    #board.tree .trow:last-child { border-radius: 0 0 10px 10px; }
    #board.tree .trow:first-child:last-child { border-radius: 10px; }
    /* A folder is a section heading: a step darker than the files under it. */
    #board.tree .trow.dir { background: var(--surface-2); }
    #board.tree .trow.root { background: var(--surface-2); border-bottom: 2px solid var(--border); }
    #board.tree .trow.file:hover { background: var(--surface-2); }
    /* One faint line per ancestor, under that ancestor's chevron, running down
     * every row inside it and stopping where the folder does. */
    #board.tree .trow::before {
      content: ""; position: absolute; left: 11px; top: 0; bottom: 0;
      width: calc(var(--depth) * var(--indent)); pointer-events: none;
      background: repeating-linear-gradient(90deg,
        transparent 0 10.5px, var(--border) 10.5px 11.5px, transparent 11.5px var(--indent));
    }
    #board.tree .tpath {
      /* The same width on every row, so the people line up down the page. */
      flex: 0 0 var(--name-w, 280px); min-width: 0; min-height: 36px;
      display: flex; align-items: center; gap: 6px;
      padding-left: calc(var(--depth) * var(--indent));
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: var(--fs-base); color: var(--fg);
    }
    #board.tree .tname { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #board.tree .tchev, #board.tree .ticon { flex: 0 0 16px; width: 16px; height: 16px; display: grid; place-items: center; }
    #board.tree .tchev { color: var(--fg-subtle); transition: transform .12s; }
    #board.tree .tchev .ico { width: 14px; height: 14px; }
    #board.tree .trow.open > .tpath .tchev { transform: rotate(90deg); }
    #board.tree .ticon { color: var(--fg-subtle); }
    #board.tree .trow.dir > .tpath .ticon { color: var(--accent-text); }
    #board.tree .trow.dir > .tpath .tname { font-weight: 600; }
    #board.tree .tpath.toggle { cursor: pointer; }
    #board.tree .tpath.toggle:hover .tname { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
    /* A folder nobody is in stays on the map but steps back. */
    #board.tree .trow.quiet > .tpath, #board.tree .trow.quiet > .tpeople { min-height: 28px; }
    #board.tree .trow.quiet > .tpath { color: var(--fg-subtle); }
    #board.tree .trow.quiet > .tpath .tname { font-weight: 400; }
    #board.tree .trow.quiet > .tpath .ticon { color: var(--fg-subtle); }
    #board.tree .trow.root > .tpath { min-height: 40px; }
    #board.tree .trow.root > .tpath .tname { font-size: var(--fs-lg); }

    /* How many are in a folder, and — when someone needs help or is being
     * watched — that too, so a collapsed folder still says what is inside it. */
    #board.tree .tcount {
      flex: 0 0 auto; font-family: inherit; font-size: var(--fs-xs); font-weight: 600; line-height: 18px;
      padding: 0 7px; border-radius: var(--radius-pill);
      background: var(--surface-2); color: var(--fg-muted);
    }
    #board.tree .tcount.help { background: var(--help-bg); color: #fff; }
    #board.tree .tcount.watch { background: var(--watch-bg); color: #fff; }

    #board.tree .tpeople {
      flex: 1 1 0; min-width: 0; min-height: 36px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
      /* The rule between the two columns, full height of the row. */
      padding: 4px 10px; border-left: 1px solid var(--border-subtle);
    }
    /* The repo row shows a summary in place of people; every other row has none. */
    #board.tree .tsum { display: none; }
    #board.tree .trow.root .tsum { display: block; flex: 1 1 0; align-self: center; padding: 0 10px; border-left: 1px solid var(--border-subtle); line-height: 40px; color: var(--fg-muted); font-size: var(--fs-sm); }
    #board.tree .trow.root .tpeople, #board.tree .trow.root .tchev, #board.tree .trow.root .ticon { display: none; }
    #board.tree .tperson {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-pill);
      color: var(--fg); font: inherit; font-size: var(--fs-base); padding: 2px 10px 2px 3px;
      cursor: pointer; text-align: left;
    }
    #board.tree .tperson:hover { background: var(--surface-2); border-color: var(--border); }
    #board.tree .tperson .avatar { width: 24px; height: 24px; font-size: 10px; }
    #board.tree .tperson .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #board.tree .tperson.help { border-color: color-mix(in srgb, var(--red) 55%, transparent); background: var(--help-wash); }
    #board.tree .tperson.watch { border-color: color-mix(in srgb, var(--amber) 55%, transparent); background: var(--watch-wash); }
    #board.tree .tperson .pill { margin-left: 2px; }

    /* Narrow: the people drop beneath the name instead of squeezing beside it. */
    @media (max-width: 720px) {
      #board.tree .trow { flex-wrap: wrap; }
      #board.tree .tpath { flex-basis: 100%; }
      #board.tree .tpeople { padding: 0 10px 8px calc(var(--depth) * var(--indent) + 32px); flex-basis: 100%; min-height: 0; border-left: 0; }
      #board.tree .trow.root .tsum { border-left: 0; line-height: 1.4; padding: 0 10px 8px 10px; flex-basis: 100%; }
      #board.tree .tpeople:not(:has(*)) { display: none; }
    }

    .column {
      flex: 0 0 264px; background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius); max-height: 100%; display: flex; flex-direction: column;
      box-shadow: var(--shadow-1);
    }
    .column > h2 {
      font-size: var(--fs-sm); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: 8px; font-weight: 600;
    }
    .column > h2 .col-title { display: inline-flex; align-items: center; gap: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .column.unassigned > h2 { color: var(--fg-muted); }
    .count { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-muted); font-weight: 600;
      background: var(--border-subtle); padding: 1px 9px; border-radius: var(--radius-pill); flex: none;
      min-width: 22px; text-align: center; }
    .summary { padding: 6px 14px 8px; font-size: var(--fs-sm); color: var(--fg-muted);
      border-bottom: 1px solid var(--border-subtle); }
    .summary .warn { color: var(--red-text); }
    .summary .muted { color: var(--fg-subtle); }
    .spark { display: block; margin-top: 7px; width: 100%; height: 22px; overflow: visible; }
    .spark .thr { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 2; }
    .cards { padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    /* Cards are real buttons: free keyboard operability + focus handling. */
    .card {
      font: inherit; color: inherit; text-align: left; width: 100%;
      display: flex; align-items: center; gap: 10px; padding: 8px;
      background: transparent; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid transparent; border-left-width: 3px;
      transition: background .12s var(--ease), border-color .12s var(--ease),
        box-shadow .12s var(--ease), transform .06s var(--ease);
    }
    .card:hover { background: var(--surface-2); border-color: var(--border); box-shadow: var(--shadow-1); }
    .card:active { transform: translateY(1px); }
    .card.open { border-color: var(--accent-text); box-shadow: 0 0 0 1px var(--accent-text) inset; }
    /* Struggle isn't only a left border — a faint wash makes "needs help" and
     * "watch" pop out of a full column at a glance, which is the whole job. */
    .card.struggle-help { border-left-color: var(--red-text); background: var(--help-wash); }
    .card.struggle-watch { border-left-color: var(--amber); background: var(--watch-wash); }
    .card.struggle-help:hover { background: color-mix(in srgb, var(--red) 20%, transparent); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
    .card.struggle-watch:hover { background: color-mix(in srgb, var(--amber) 20%, transparent); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
    .pill { font-size: var(--fs-xs); padding: 1px 8px; border-radius: var(--radius-pill); margin-left: 6px;
      font-weight: 600; flex: none; letter-spacing: .01em; box-shadow: var(--shadow-1); }
    .pill.help { background: var(--help-bg); color: #fff; }
    .pill.watch { background: var(--watch-bg); color: #fff; }
    .who .reason { font-size: var(--fs-sm); color: var(--amber); margin-top: 2px;
      display: flex; align-items: flex-start; gap: 4px; }
    .who .prov { font-size: var(--fs-xs); color: var(--fg-subtle); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .avatar {
      position: relative; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 700; color: #fff;
      user-select: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    }
    /* Status differs by FILL, not just hue — readable when colour isn't. */
    .avatar .dot {
      position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px;
      border-radius: 50%; box-sizing: border-box;
    }
    .dot.active { background: var(--green); border: 2px solid var(--surface); }
    .dot.idle { background: var(--surface); border: 2px solid var(--fg-subtle); }

    .who { min-width: 0; flex: 1; }
    .who .name { font-weight: 600; font-size: var(--fs-base); display: flex; align-items: center; min-width: 0; }
    .who .name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .who .file { color: var(--fg-muted); font-size: var(--fs-sm); font-family: ui-monospace, monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .time { font-size: var(--fs-sm); margin-top: 2px; color: var(--fg-muted); }
    .time .clock { color: var(--fg); display: inline-flex; align-items: center; gap: 4px; }
    .time .sep { color: var(--border); margin: 0 5px; }
    .time .typing { color: var(--green-text); display: inline-flex; align-items: center; gap: 4px; }

    .empty { margin: auto; color: var(--fg-muted); padding: 40px; text-align: center; }
    .empty.first-run { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .empty.first-run h2 { margin: 0; font-size: var(--fs-lg); color: var(--fg); font-weight: 600; }
    .empty.first-run p { margin: 0 0 8px; font-size: var(--fs-base); }

    #toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column;
      gap: 8px; z-index: 1000; }
    .toast { background: var(--accent); color: #fff; padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: var(--fs-base); box-shadow: var(--shadow-2); max-width: 320px;
      opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ---- Resizable divider between board and terminal dock ---- */
    #divider { flex: 0 0 6px; cursor: col-resize; background: var(--border-subtle); display: none; }
    #divider.active { display: block; }
    #divider:hover, #divider.dragging { background: var(--accent); }

    /* ---- Terminal dock (extra panes) ---- */
    #dock {
      flex: 1.5 1 0; min-width: 0;
      display: none; grid-auto-rows: minmax(240px, 1fr); gap: 1px; background: var(--border-subtle);
      overflow-y: auto;
    }
    #dock.active { display: grid; }
    .pane { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .pane > .pane-head {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; background: var(--surface); border-bottom: 1px solid var(--border-subtle);
      font-size: var(--fs-sm);
    }
    .pane-head .ex { color: var(--fg-muted); font-size: var(--fs-sm); }
    /* With five or six tiles a pane is ~390px wide. The name is the one thing
     * that can give way, so it takes whatever is left and ellipsizes, and every
     * control keeps its size: a pane whose close button had been pushed out of
     * sight could not be closed. */
    .pane-head .who { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pane-head > .avatar, .pane-head .modes, .pane-head .diff, .pane-head .close { flex: 0 0 auto; }
    .pane-head .close {
      margin-left: auto; cursor: pointer; color: var(--fg-muted); border: none; background: none;
      font-size: var(--fs-lg); line-height: 1; padding: 2px 6px; border-radius: 5px;
    }
    .pane-head .close:hover { background: var(--border); color: var(--fg); }
    .pane-head .close { min-width: 24px; min-height: 24px; }
    .pane > .term { flex: 1 1 auto; min-height: 0; padding: 6px 8px; }
    .pane .note { margin: auto; color: var(--fg-muted); font-size: var(--fs-base); padding: 24px; text-align: center; }

    /* ---- Pane mode switch: their terminal, or the file they're editing ---- */
    .pane-head .modes {
      display: flex; gap: 2px; background: var(--bg);
      border: 1px solid var(--border-subtle); border-radius: 6px; padding: 2px;
    }
    .pane-head .modes button, .pane-head .diff {
      cursor: pointer; border: none; background: none; color: var(--fg-muted);
      font: inherit; font-size: var(--fs-xs); padding: 2px 10px; border-radius: 4px;
      min-height: 24px;
    }
    .pane-head .modes button:hover, .pane-head .diff:hover { color: var(--fg); }
    .pane-head .modes button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
    .pane-head .diff { border: 1px solid var(--border-subtle); display: none; }
    .pane.mode-file .pane-head .diff { display: block; }
    .pane-head .diff[aria-pressed="true"] {
      background: var(--accent-wash); color: var(--accent-text);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    }

    /* ---- File view: the buffer a student has on screen right now ----
     * Highlighted from spans the backend computes (see crates/server/src/
     * highlight.rs), mapped onto this board's own tokens so it follows the
     * theme. The diff view is highlighted from the same spans — see the .dl
     * rules below for why that doesn't fight the added/removed washes. */
    .pane > .filev { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; }
    .pane.mode-file > .filev { display: flex; }
    .pane.mode-file > .term { display: none; }
    /* The path takes a line of its own when it needs one, and the facts about the
     * buffer (unsaved, truncated, how old, what changed) wrap beneath it as whole
     * items. They used to be run together with "·" characters, which left a dot
     * dangling at the start of a wrapped line and split "42s ago" in two. */
    .filev .fv-head {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: baseline;
      column-gap: 12px; row-gap: 2px; min-width: 0;
      padding: 5px 10px; border-bottom: 1px solid var(--border-subtle);
      font-size: var(--fs-xs); color: var(--fg-muted);
    }
    .filev .fv-head .fp {
      flex: 1 1 100%; min-width: 0;
      color: var(--fg); font-family: ui-monospace, monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .filev .fv-head .chip { white-space: nowrap; }
    .filev .fv-head .sum { margin-left: auto; white-space: nowrap; }
    .filev .fv-head .plus { color: var(--green-text); }
    .filev .fv-head .minus { color: var(--red-text); }
    .filev .fv-head .stale { color: var(--amber); }
    .filev .fv-body {
      position: relative; flex: 1 1 auto; min-height: 0; overflow: auto;
      font-family: ui-monospace, monospace; font-size: var(--fs-sm); line-height: 1.5;
    }
    .filev .fv-body.empty { display: flex; }
    /* A state note is a sentence, not source: the code font would set it in a
     * wide letter-spaced column that wraps to eight lines in a narrow tile. */
    .filev .note { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
    /* Every row is as wide as the widest, so a row's wash (the cursor line, an
     * added or removed line) runs as far as the longest line does when the code
     * area scrolls sideways, instead of stopping where the pane ends. */
    .filev .rows { display: grid; width: max-content; min-width: 100%; }
    .filev .cl, .filev .dl { display: flex; white-space: pre; }
    .filev .cl > .n, .filev .dl > .n {
      flex: 0 0 auto; min-width: 4ch; padding: 0 8px; text-align: right;
      color: var(--fg-subtle); user-select: none;
    }
    .filev .cl > .t, .filev .dl > .t { flex: 1 0 auto; padding-right: 12px; }
    .filev .cl.cur { background: var(--cursor-line-wash); }
    .filev .cl.cur > .n { color: var(--accent-text); font-weight: 700; }
    /* The cursor itself, at the column the student's caret is in. */
    .filev .caret {
      display: inline-block; width: 2px; height: 1.1em; margin: 0 -1px;
      vertical-align: text-bottom; background: var(--accent);
      animation: caret-blink 1.1s steps(1) infinite;
    }
    @keyframes caret-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .filev .caret { animation: none; } }
    .filev .hl-c { color: var(--hl-comment); font-style: italic; }
    .filev .hl-s { color: var(--hl-string); }
    .filev .hl-n { color: var(--hl-number); }
    .filev .hl-k { color: var(--hl-keyword); }
    .filev .hl-f { color: var(--hl-function); }
    .filev .hl-t { color: var(--hl-type); }
    .filev .hl-o { color: var(--hl-operator); }
    .filev .dh {
      padding: 3px 8px; margin-top: 4px; color: var(--fg-subtle);
      background: var(--surface); border-top: 1px solid var(--border-subtle);
    }
    /* Added-or-removed lives entirely in the background, the way GitHub's diff
     * does it (their diffBlob additionLine/deletionLine fgColor is plain
     * fgColor.default). Spending the foreground on it too is what would make
     * syntax colour "compete" — so the text here is left to the highlighter,
     * and the washes are kept pale enough to read through. */
    .filev .dl.add { background: var(--diff-add-wash); }
    .filev .dl.del { background: var(--diff-del-wash); }
    /* Within an edited line, the words that changed are underlined in the row's
     * own colour. A stronger wash is what GitHub does, but here the syntax
     * colours already sit just above 4.5:1 on the row washes, and a second wash
     * under them would take the changed words — the ones a teacher reads
     * hardest — below it. An underline leaves the text's ground alone. */
    .filev .dl .wd { border-radius: 1px; }
    .filev .dl.add .wd { box-shadow: inset 0 -2px 0 var(--green-text); }
    .filev .dl.del .wd { box-shadow: inset 0 -2px 0 var(--red-text); }
    /* The +/- itself is the one bit of the row that is about the diff. */
    .filev .dl > .t > .sg { color: var(--fg-subtle); }
    .filev .dl.add > .n:last-of-type, .filev .dl.add > .t > .sg { color: var(--green-text); }
    .filev .dl.del > .n:first-of-type, .filev .dl.del > .t > .sg { color: var(--red-text); }

    /* ---- Broadcast composer (modal) ---- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(1,4,9,.6);
      display: grid; place-items: center; z-index: 2000; }
    .modal { width: 440px; max-width: calc(100vw - 32px); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px;
      box-shadow: var(--shadow-3); }
    .modal h2 { margin: 0 0 4px; font-size: var(--fs-lg); }
    .modal .sub { margin: 0 0 14px; color: var(--fg-muted); font-size: var(--fs-sm); }
    .modal textarea { width: 100%; min-height: 96px; resize: vertical; background: var(--bg);
      color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      font: inherit; font-size: var(--fs-base); }
    .modal .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .modal .ct { margin-right: auto; color: var(--fg-subtle); font-size: var(--fs-sm); }
    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--fg); font: inherit; font-size: var(--fs-sm); cursor: pointer; }
    .btn:hover { background: var(--border); }
    .btn.primary { background: var(--green); border-color: transparent; color: #fff; font-weight: 600; }
    .btn.primary:hover { background: var(--green-emphasis); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---- Assistant settings form (modal) ---- */
    .modal.wide { width: 540px; }
    .modal .field { margin-top: 12px; }
    .modal .field > label { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: 4px; }
    .modal .field .desc { font-weight: 400; color: var(--fg-subtle); font-size: var(--fs-xs); }
    .modal input[type="text"] {
      width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font: inherit; font-size: var(--fs-base);
    }
    .modal textarea.mono { font-family: ui-monospace, monospace; min-height: 64px; }
    .modal input.mono { font-family: ui-monospace, monospace; }
    .modal .toggle { display: flex; align-items: center; gap: 8px; font-size: var(--fs-base); cursor: pointer; }
    .modal .toggle input { width: 16px; height: 16px; }
    .modal .notice { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-sm);
      background: var(--surface-2); color: var(--fg-muted); }
    .modal .notice.warn { color: var(--amber); }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/" title="Back to the board">
      <img class="logo-mark" src="/assets/hermione-mark.svg" alt="" aria-hidden="true" />
      <h1>Hermione</h1>
    </a>
    <label class="visually-hidden" for="course">Course</label>
    <select id="course" title="Course"></select>

    </button>
    <a id="course-repo" class="course-repo" target="_blank" rel="noopener" title="Open the linked repository" style="display:none">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      <span id="course-repo-name"></span>
    </a>
    <div id="view-toggle" role="group" aria-label="View">
      <button type="button" data-view="board" aria-pressed="true" aria-label="Board view" title="Board — students grouped by exercise">
        <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.5 2h4v12h-4V2zm5 0h4v7h-4V2zm5 0h4v10h-4V2z"/></svg>
      </button>
      <button type="button" data-view="tree" aria-pressed="false" aria-label="Tree view" title="Tree — the files everyone has open">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 1.5v10.5h4M3 6.5h4M11 2.2h3.2M11 7.2h3.2M11 12.2h3.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <span id="alert" aria-live="assertive"></span>
    <span class="spacer"></span>
    <a class="nav" href="/analytics" title="Time-on-task analytics" aria-label="Analytics">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 13.5h12v1.3H1V2h1.3v11.5zM5 11V7h1.6v4H5zm3-6h1.6v6H8V5zm3 2.5h1.6V11H11V7.5z"/></svg>
      <span class="lbl">Analytics</span>
    </a>
    <a class="nav" href="/transcripts" title="Read student conversations with the assistant" aria-label="Transcripts">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h12a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H6l-3 3v-3H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm2 3v1.3h8V5H4zm0 2.7V9h5V7.7H4z"/></svg>
      <span class="lbl">Transcripts</span>
    </a>
    <button id="broadcast" type="button" title="Send a message to all students in this course" aria-label="Broadcast">
      <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.5 2.2 4.6 5.5H2.3A1.3 1.3 0 0 0 1 6.8v2.4a1.3 1.3 0 0 0 1.3 1.3h.6l1 3.2h2l-.9-3.2 6.5 3V2.2zM13.8 6a2 2 0 0 1 0 4V6z"/></svg>
      <span class="lbl">Broadcast</span>
    </button>
    <div id="more-wrap">
      <button id="more" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" aria-label="More" title="More — new course, assistant, theme, sign out">
        <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>
      </button>
      <div id="more-menu" role="menu" aria-label="More" hidden>
        <button id="new-course" type="button" role="menuitem">
          <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8.75 2.5a.75.75 0 0 0-1.5 0v4.75H2.5a.75.75 0 0 0 0 1.5h4.75v4.75a.75.75 0 0 0 1.5 0V8.75h4.75a.75.75 0 0 0 0-1.5H8.75V2.5z"/></svg>
          New course…
        </button>
        <button id="assistant-settings" type="button" role="menuitem" title="Configure the AI teaching assistant for this course">
          <svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 1h4l.4 2.1 1.4.8 2-.8 2 3.4-1.6 1.4v1.6L15.2 11l-2 3.4-2-.8-1.4.8L10 16H6l-.4-2.6-1.4-.8-2 .8L.2 10l1.6-1.4V7L.2 5.6l2-3.4 2 .8 1.4-.8zM8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 0 0 8 5.5z"/></svg>
          Assistant settings
        </button>
        <button id="theme-toggle" type="button" role="menuitem"></button>
        <hr role="separator">
        <button id="logout" type="button" role="menuitem">
          <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6.5"/></svg>
          Sign out
        </button>
