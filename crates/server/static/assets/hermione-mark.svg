<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" role="img" aria-label="Hermione — a stoat on a rock">
  <defs>
    <clipPath id="badge"><circle cx="192" cy="192" r="186"/></clipPath>
    <path id="body" d="M112 99
      C 106 82 120 66 143 66
      C 161 65 173 73 181 87
      C 190 103 197 123 203 147
      C 209 169 214 190 218 209
      C 221 227 224 245 231 256
      C 224 260 216 258 212 250
      C 207 258 197 263 184 264
      C 170 265 157 264 149 259
      C 142 253 140 245 138 233
      C 135 216 136 198 138 181
      C 140 163 142 150 149 140
      C 154 132 153 124 147 116
      C 141 109 121 104 112 99 Z"/>
    <path id="tail" d="M202 190 C 226 202 243 228 248 254 C 250 265 241 268 234 261 C 224 246 210 224 196 208 Z"/>
  </defs>
  <g clip-path="url(#badge)">
    <!-- sky, lightening toward the horizon -->
    <rect x="0" y="0" width="384" height="384" fill="#2f9998"/>
    <rect x="0" y="150" width="384" height="234" fill="#4fa7a0"/>
    <rect x="0" y="182" width="384" height="202" fill="#71bbb2"/>
    <rect x="0" y="198" width="384" height="186" fill="#8ccabf"/>
    <!-- clouds -->
    <g fill="#e7efe4">
      <rect x="118" y="34" width="70" height="6" rx="3"/>
      <rect x="150" y="48" width="46" height="5" rx="2.5"/>
      <rect x="98" y="62" width="32" height="5" rx="2.5"/>
      <ellipse cx="62" cy="126" rx="50" ry="16"/>
      <ellipse cx="94" cy="132" rx="28" ry="11"/>
    </g>
    <ellipse cx="332" cy="156" rx="58" ry="6.5" fill="#d7e6cf"/>
    <!-- rocks -->
    <path d="M4 262 C 28 244 62 246 78 266 C 90 282 84 304 66 312 C 42 322 12 312 4 292 Z" fill="#47343b"/>
    <path d="M11 262 C 31 250 56 252 70 266 C 54 262 30 264 16 276 C 10 282 9 270 11 262 Z" fill="#6f5a4e"/>
    <path d="M92 306 C 128 274 172 268 214 272 C 258 276 298 290 314 312 C 326 330 312 356 286 360 L 104 360 C 84 352 78 322 92 306 Z" fill="#47343b"/>
    <path d="M104 300 C 138 278 178 272 216 276 C 256 280 292 292 308 308 C 276 292 236 286 200 288 C 160 290 122 294 104 300 Z" fill="#6f5a4e"/>
    <path d="M214 300 C 246 300 280 308 300 322 C 272 312 240 308 214 310 C 200 311 200 300 214 300 Z" fill="#7d6656"/>
    <!-- tail (behind body) -->
    <use href="#tail" fill="#43333b" stroke="#43333b" stroke-width="8" stroke-linejoin="round"/>
    <use href="#tail" fill="#a4564a"/>
    <!-- weasel body: dark outline halo, then cream -->
    <use href="#body" fill="#43333b" stroke="#43333b" stroke-width="8" stroke-linejoin="round"/>
    <use href="#body" fill="#fdf3d9"/>
    <!-- rust dorsal band: head crown → back of neck → spine -->
    <path d="M143 68
      C 161 67 173 75 181 89
      C 190 105 197 125 203 149
      C 208 170 213 190 217 208
      C 210 195 203 177 196 157
      C 188 135 180 115 170 99
      C 162 85 153 77 142 75
      C 139 72 140 69 143 68 Z" fill="#a4564a"/>
    <!-- head details -->
    <path d="M158 69 C 166 64 175 68 177 78 C 169 75 163 74 156 76 Z" fill="#43333b"/>
    <ellipse cx="148" cy="89" rx="5" ry="6" fill="#2c2026"/>
    <circle cx="114" cy="100" r="5.6" fill="#2c2026"/>
    <path d="M119 109 C 127 112 135 112 141 109" fill="none" stroke="#43333b" stroke-width="3" stroke-linecap="round"/>
    <!-- front paws -->
    <g stroke="#43333b" stroke-width="3" stroke-linecap="round">
      <path d="M170 260 L 170 250"/>
      <path d="M186 262 L 186 252"/>
      <path d="M201 260 L 201 251"/>
    </g>
    <!-- badge rim -->
    <circle cx="192" cy="192" r="183" fill="none" stroke="#16302a" stroke-width="5" opacity="0.45"/>
  </g>
</svg>
