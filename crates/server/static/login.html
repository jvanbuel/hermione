<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermione — Sign in</title>
  <!-- Honour the saved theme (and otherwise prefers-color-scheme) before paint. -->
  <script>
    try {
      var t = localStorage.getItem('hermione.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    body {
      display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base);
    }
    .card {
      width: 320px; background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 28px; text-align: center;
    }
    .glyph { color: var(--brand); }
    .glyph svg { width: 40px; height: 40px; }
    h1 { font-size: var(--fs-xl); margin: 8px 0 4px; }
    p { color: var(--fg-muted); font-size: var(--fs-sm); margin: 0 0 20px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--fg); font-size: var(--fs-base); margin-bottom: 12px;
    }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
      background: var(--green); color: #fff; font-size: var(--fs-base); font-weight: 600;
    }
    button:hover { background: var(--green-emphasis); }
    .error { color: var(--red); font-size: var(--fs-sm); min-height: 1.1em; margin-top: 10px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 17.5h8l1.8 3.5H6.2z" fill="currentColor" opacity="0.55"/><circle cx="12" cy="9.5" r="7.5" fill="currentColor" opacity="0.15"/><circle cx="12" cy="9.5" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.6 7.2a4.4 4.4 0 0 1 3.2-2.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    <h1>Hermione</h1>
    <p>Teacher sign in</p>
    <input id="username" type="text" placeholder="Username" autofocus autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) { window.location.href = '/'; }
        else if (res.status === 401) { error.textContent = 'Incorrect username or password.'; }
        else { error.textContent = 'Sign-in failed. Please try again.'; }
      } catch (_) { error.textContent = 'Could not reach the server.'; }
    });
  </script>
</body>
</html>
