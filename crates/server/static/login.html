<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermione — Sign in</title>
  <!-- Honour the saved theme (and otherwise prefers-color-scheme) before paint. -->
  <script>
    try {
      var t = localStorage.getItem('hermione.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    body {
      display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs-base); position: relative; overflow: hidden;
    }
    /* A soft brand halo behind the card, so the sign-in isn't a lone box on an
     * empty board. Sits above <body>'s chalk texture, below the card. */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(42rem 42rem at 50% -8%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 60%),
        radial-gradient(38rem 38rem at 50% 120%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%);
    }
    .card {
      position: relative; z-index: 1;
      width: 340px; background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 32px 30px 26px; text-align: center;
      box-shadow: var(--shadow-3);
    }
    .glyph {
      color: var(--brand); width: 60px; height: 60px; margin: 0 auto 4px;
      display: grid; place-items: center; border-radius: 50%;
      background: color-mix(in srgb, var(--brand) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--brand) 32%, transparent);
    }
    .glyph svg { width: 34px; height: 34px; }
    h1 { font-size: var(--fs-xl); margin: 10px 0 2px; letter-spacing: -.01em; }
    .tag { color: var(--fg-muted); font-size: var(--fs-sm); margin: 0 0 22px; line-height: 1.45; }
    .field { text-align: left; margin-bottom: 12px; }
    .field label {
      display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--fg-muted);
      text-transform: uppercase; letter-spacing: .04em; margin: 0 0 5px 2px;
    }
    input {
      width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--bg); color: var(--fg); font: inherit; font-size: var(--fs-base);
      transition: border-color .12s var(--ease), box-shadow .12s var(--ease);
    }
    input:focus { outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-wash); }
    button {
      width: 100%; padding: 11px; border: none; border-radius: var(--radius-sm); cursor: pointer;
      background: var(--green); color: #fff; font: inherit; font-size: var(--fs-base); font-weight: 600;
      margin-top: 6px; box-shadow: var(--shadow-1);
      transition: background .12s var(--ease), transform .06s var(--ease);
    }
    button:hover { background: var(--green-emphasis); }
    button:active { transform: translateY(1px); }
    .error { color: var(--red); font-size: var(--fs-sm); min-height: 1.1em; margin-top: 12px; font-weight: 500; }
    .foot { position: fixed; bottom: 18px; left: 0; right: 0; z-index: 1;
      text-align: center; color: var(--fg-subtle); font-size: var(--fs-xs); }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 17.5h8l1.8 3.5H6.2z" fill="currentColor" opacity="0.55"/><circle cx="12" cy="9.5" r="7.5" fill="currentColor" opacity="0.15"/><circle cx="12" cy="9.5" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.6 7.2a4.4 4.4 0 0 1 3.2-2.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
    <h1>Hermione</h1>
    <p class="tag">The observability platform for teachers.<br>Sign in to watch your class live.</p>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="you@school.edu" autofocus autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button type="submit">Sign in</button>
    <div class="error" id="error"></div>
  </form>
  <div class="foot">🔮 Hermione · live terminal observability for the classroom</div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) { window.location.href = '/'; }
        else if (res.status === 401) { error.textContent = 'Incorrect username or password.'; }
        else { error.textContent = 'Sign-in failed. Please try again.'; }
      } catch (_) { error.textContent = 'Could not reach the server.'; }
    });
  </script>
</body>
</html>
