name: Release

# Tag a release (e.g. `git tag v0.1.0 && git push --tags`) to build and publish
# the recorder binaries, the VSCode extension, and the server image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  recorder:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: hermione-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: hermione-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--release -p hermione-recorder"
      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }}.tar.gz hermione
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.tar.gz

  extension:
    runs-on: ubuntu-latest
    env:
      # Job-level so the publish step's `if` can test it; a step's own `env`
      # block is not visible to its own condition.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: vscode-extension
      # The Marketplace rejects a version it already has, so take the version
      # from the tag rather than from package.json. Tagging is then the only
      # thing that has to be right.
      - run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/hermione-vscode.vsix
      # Publishing is what makes the `lightcone.hermione-vscode` reference in a
      # course's devcontainer.json resolve. Skipped when the secret is absent,
      # so a release still succeeds in a fork.
      # The gallery intermittently hangs until vsce's fixed 180s timeout: v0.1.5
      # did, while v0.1.4 and v0.1.6 published in under a second. Retry rather
      # than swallow it — a publish that silently does not happen is worse than
      # a red job, and the image and recorder jobs are independent anyway.
      # A publish can also succeed server-side and still time out client-side,
      # so an "already exists" on a retry counts as done.
      - name: Publish to the VSCode Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode-extension
        run: |
          for attempt in 1 2 3; do
            if out=$(npx vsce publish --packagePath hermione-vscode.vsix 2>&1); then
              echo "$out"; exit 0
            fi
            echo "$out"
            case "$out" in
              *already*exists*) echo "version already on the Marketplace — treating as published"; exit 0 ;;
            esac
            echo "::warning::vsce publish attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::vsce publish failed three times; the vsix is still attached to the release"
          exit 1

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
