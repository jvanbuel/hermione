name: Release

# Tag a release (e.g. `git tag v0.1.0 && git push --tags`) to build and publish
# the recorder binaries, the VSCode extension, and the server image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  recorder:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: hermione-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: hermione-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--release -p hermione-recorder"
      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.asset }}.tar.gz hermione
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.tar.gz

  extension:
    runs-on: ubuntu-latest
    env:
      # Job-level so the publish step's `if` can test it; a step's own `env`
      # block is not visible to its own condition.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: vscode-extension
      # The Marketplace rejects a version it already has, so take the version
      # from the tag rather than from package.json. Tagging is then the only
      # thing that has to be right.
      - run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/hermione-vscode.vsix
      # Publishing is what makes the `lightcone.hermione-vscode` reference in a
      # course's devcontainer.json resolve. Skipped when the secret is absent,
      # so a release still succeeds in a fork.
      # The vsix is already attached to the release above, so a Marketplace
      # outage should not fail the release or block the recorder and image.
      - name: Publish to the VSCode Marketplace
        if: env.VSCE_PAT != ''
        continue-on-error: true
        run: npx vsce publish --packagePath hermione-vscode.vsix
        working-directory: vscode-extension

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
