name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hermione
          POSTGRES_PASSWORD: hermione
          POSTGRES_DB: hermione_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermione"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      # Pinned, not @stable: a new stable release must not be able to redden
      # main on its own. Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          HERMIONE_TEST_DATABASE_URL: postgres://hermione:hermione@localhost:5432/hermione_test

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
